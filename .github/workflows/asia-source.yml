name: Asia city source candidates

on:
  push:
    branches: ['codex/world-asia-20261011']
    paths: ['scripts/geo/asia-source-targets.json']

permissions:
  contents: read

concurrency:
  group: asia-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0786c00510f2827d6495a53fc3299f3112d0d6b4
          path: factory-source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a57e756a10b35a0eec9ec5928f083580fb9e7a9
          path: geometry-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Install pinned source and geometry dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input 'osmium==4.3.1' 'shapely==2.1.2'
          npm ci --prefix geometry-source --ignore-scripts --no-audit --no-fund
      - name: Derive source candidates sequentially from verified offline PBFs
        run: |
          python scripts/geo/asia-source-run.py \
            --table scripts/geo/asia-source-targets.json \
            --factory-source "$GITHUB_WORKSPACE/factory-source" \
            --geometry-source "$GITHUB_WORKSPACE/geometry-source" \
            --outdir "$RUNNER_TEMP/asia-source"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: asia-source-${{ github.sha }}
          path: ${{ runner.temp }}/asia-source/publish
          if-no-files-found: error
