name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_checks:
        description: Run the full Node 22, Node 24, and Worker checks
        required: true
        type: boolean
        default: false
      ui_checks:
        description: Run focused app UI model and component regressions
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The production build needs more than Node's default heap (about 4 GB): peak use is about 5 GB with the 86-city set.
  NODE_OPTIONS: --max-old-space-size=8192

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/guard-joinallworld-package.test.mjs
      - name: Verify complete Node test partition inventory
        run: node --experimental-strip-types scripts/node-test-plan.ts --plan

  typecheck-fast:
    if: github.event_name != 'workflow_dispatch' || !inputs.full_checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  build-and-smoke-fast:
    if: github.event_name != 'workflow_dispatch' || !inputs.full_checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Preserve Story bundle evidence
        if: startsWith(github.ref, 'refs/heads/story/') || startsWith(github.ref, 'refs/heads/codex/story-')
        uses: actions/upload-artifact@v4
        with:
          name: story-bundle-${{ github.sha }}
          include-hidden-files: true
          path: |
            dist/assets/*.js
            dist/assets/*.css
            dist/.vite/manifest.json
            dist/index.html
            dist/county/index.html
            dist/cities/index.html
            dist/cities/scenes/index.html
            dist/assets/scene-factory/**
          retention-days: 3
      - run: npm run size:download
      - run: npm run cartridge:check
      - name: Refuse retired character assets in the production bundle
        run: |
          node --input-type=module -e "import {readdirSync} from 'node:fs'; const files=readdirSync('dist',{recursive:true}); const retired=files.filter(p=>/(?:base-body-|mpfb-body-|mpfb-lod-|canonical-crowd-body)/.test(p)); if(retired.length) throw Error('Retired character assets emitted: '+retired.join(', ')); console.log('Production bundle contains no retired character body assets');"
      - run: npm run test:smoke
      - name: Native character integration regressions
        run: |
          node --experimental-strip-types --test --test-concurrency=1 src/quick-start/model.test.ts src/app/features/start/startModels.test.ts src/game/look-options.test.ts src/scene/street-life/near.test.ts src/scene/street-life/near-draw.test.ts
          node --experimental-strip-types docs/agent-work/native-character-release-evidence-20261016/native-height-probe.mjs
          node --experimental-strip-types docs/agent-work/native-character-release-evidence-20261016/neighbourhood-player-ownership-probe.mjs
          node --experimental-strip-types docs/agent-work/native-character-release-evidence-20261016/native-scenes-probe.mjs
          node --experimental-strip-types docs/agent-work/native-character-release-evidence-20261016/native-street-probe.mjs

  ui-regressions:
    if: github.event_name == 'workflow_dispatch' && inputs.ui_checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: build
        run: npm run build
      - name: Existing app UI model and component checks
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          src/app/features/models.test.ts
          src/app/features/support/supportPanel.test.ts
          src/app/features/money/statementHistory.test.ts
          src/app/features/business/business.test.ts
          src/app/features/business/businessComponents.test.ts
          src/app/features/visit/visit.test.ts
          src/app/features/growth/growth.test.ts
          src/app/features/growth/components.test.ts
          src/app/features/politics/politicsModel.test.ts
          src/app/features/politics/politicsComponents.test.ts
          src/app/features/messages/notifyModel.test.ts
          src/app/features/messages/messagesComponents.test.ts
          src/app/features/messages/messagesText.test.ts
          src/app/features/messages/messagesState.test.ts
          src/app/features/messages/pictureModel.test.ts
          src/app/features/sim/soundSettingsModel.test.ts
          src/app/features/start/creatorModel.test.ts
          src/app/features/start/startModels.test.ts
          src/app/features/start/startComponents.test.ts
          src/app/features/tables/tablesModel.test.ts
          src/app/features/tables/tablesComponents.test.ts
          src/app/features/tables/chessModel.test.ts
          src/app/features/tables/chessBoard.test.ts
          src/app/features/tables/weaveModel.test.ts
          src/app/features/tables/weaveBoard.test.ts
          server/economy/effects.test.ts
          server/recovery-action-intent.test.ts
          server/salt.test.ts
          server/economy/history.test.ts
          server/admin/admin.test.ts
          server/bonus.test.ts
          server/ride-credit.test.ts
          src/client.test.ts
          src/app/features/civic/civicModel.test.ts
          src/app/features/civic/civicCore.test.ts
          src/app/features/locate/badge.test.ts
          src/app/features/locate/locateComponents.test.ts
          src/app/features/travel/travelModel.test.ts
          server/character.test.ts
          server/social.test.ts
          server/visit.test.ts
          src/ui/attention.test.ts
          src/app/features/social/socialClient.test.ts

      - name: Existing scene adapter and atlas checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          node --experimental-strip-types --import ./scripts/node-scene-css.ts
          --test --test-concurrency=1
          src/scene/city-scenes.test.ts src/map3d/geo/atlas.test.ts

      - name: Existing map renderer, water and startup checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          node --experimental-strip-types --import ./scripts/node-scene-css.ts
          --test --test-concurrency=1
          src/map3d/map3d.test.ts src/map3d/context-water.test.ts
          src/map3d/context.test.ts src/map3d/lagos-geo.test.ts src/map3d/water.test.ts
          src/scene/body/startup-gate.test.ts
          src/scene/body/stand-in.test.ts src/scene/body/animation-pose.test.ts
          src/scene/home-lighting.test.ts src/scene/venue-contact.test.ts
          src/venue-world-lights.test.ts src/venue-world.test.ts
          src/models/vehicles/vehicles.test.ts

      - name: Existing directory and public discovery components
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          --test-name-pattern='Neighbours:|People:|Contacts: found players'
          src/app/features/civic/civicComponents.test.ts
          src/app/features/social/socialComponents.test.ts

      - name: Existing shopping, housing and career checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          --test-name-pattern='groceries|Groceries:|Health:|jobs:|Jobs:|career:|Career:|Houses and Cars:|sim tabs:|Profile:|Goals:'
          src/app/features/panelsA.test.ts

  host-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.ui_checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - id: root-install
        run: npm ci --no-audit --no-fund
      - name: Generate runtime content assets
        run: npm run cities:assets && npm run words:assets && npm run progression:assets
      - name: Business quote and identity-safe retry checks
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          server/business.test.ts server/combined.test.ts
          server/politics.test.ts server/politics-assembly.test.ts
          server/once.test.ts src/app/features/civic/civicCore.test.ts
          src/client.test.ts

      - name: Private voice Node acceptance
        if: ${{ !cancelled() && steps.root-install.outcome == 'success' }}
        run: node --experimental-strip-types --test --test-concurrency=1 server/social/voice-notes.test.ts

      - name: African capital Node receipts and persisted journeys
        if: ${{ !cancelled() && steps.root-install.outcome == 'success' }}
        run: node --experimental-strip-types --test --test-concurrency=1 server/africa-host.test.ts

      - name: Teaching start policy and actual Node rollback receipts
        if: ${{ !cancelled() && steps.root-install.outcome == 'success' }}
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          src/game/teaching-start-policy.test.ts src/game/teaching-career.test.ts
          server/teaching-career.test.ts

      - id: worker-install
        if: ${{ !cancelled() && steps.root-install.outcome == 'success' }}
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix deploy/tooling
      - name: Existing Worker host and timed-action checks
        if: ${{ !cancelled() && steps.worker-install.outcome == 'success' }}
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          deploy/trip-skip.edge.test.ts deploy/live.edge.test.ts
          deploy/admin.edge.test.ts deploy/ride-credit.edge.test.ts
          deploy/visit.edge.test.ts

      - name: Business quote and private voice Worker acceptance
        if: ${{ !cancelled() && steps.worker-install.outcome == 'success' }}
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          deploy/business.edge.test.ts deploy/voice-notes.edge.test.ts

      - name: African capital Worker receipts and persisted journeys
        if: ${{ !cancelled() && steps.worker-install.outcome == 'success' }}
        run: node --experimental-strip-types --test --test-concurrency=1 deploy/africa-host.test.ts

      - name: Living-world Worker persistence and teaching gate-off recovery
        if: ${{ !cancelled() && steps.worker-install.outcome == 'success' }}
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          deploy/living-world.edge.test.ts deploy/living-world-learning.edge.test.ts
          deploy/living-world-restart.edge.test.ts deploy/living-world-account.edge.test.ts
          deploy/living-world-barber.edge.test.ts deploy/living-world-clerk.edge.test.ts
          deploy/living-world-rental.edge.test.ts deploy/living-world-teaching.edge.test.ts

  full:
    if: github.event_name == 'workflow_dispatch' && inputs.full_checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - id: root-install
        run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # The build comes first: the tests that read dist/ (bundle budgets, the served files) skip themselves without it.
      - id: build
        if: ${{ !cancelled() && steps.root-install.outcome == 'success' }}
        run: npm run build
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run size:download
      - name: Cartridge manifests and caps
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run cartridge:check

  # These complete suites have their own clocks: a preceding compiler/budget failure remains
  # failed, while it cannot consume the time needed for the independent Node/Worker evidence.
  full-node:
    if: github.event_name == 'workflow_dispatch' && inputs.full_checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        node: [22, 24]
        # economy, allCities, combinedRules, relief and stuck are five files of src/ that run for 5 to 19 minutes each: the game jobs could not hold
        # them, and allCities and stuck are split in two (scripts/node-test-plan.ts). The rest of src/ is three shards.
        suite: [game-1, game-2, game-3, host, tooling, economy, cities-1, cities-2, routes, homeward, stuck-1, stuck-2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: build
        run: npm run build
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        name: Complete existing ${{ matrix.suite }} Node corpus
        run: npm run -s preflight && node --experimental-strip-types scripts/node-test-plan.ts ${{ matrix.suite }}

  full-worker:
    if: github.event_name == 'workflow_dispatch' && inputs.full_checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        # The Worker tests took 12 to 17 minutes in one job, and the job was cancelled once at 25 with every test passed: two shards (scripts/node-test-plan.ts).
        suite: [edge-1, edge-2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix deploy/tooling
      - run: node --experimental-strip-types scripts/node-test-plan.ts ${{ matrix.suite }}

  integration-repairs:
    if: github.event_name == 'workflow_dispatch' && inputs.full_checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: build
        run: npm run build
      # src/game/cities/allCities.test.ts and src/game/economy.test.ts are not here: together they need more than this job's 15 minutes
      # (about 10 and 14), and the economy and cities jobs of full-node run them with their own clocks.
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          server/chat.test.ts server/living-world/mapped-trip-service.test.ts
          server/new-player.test.ts server/two-players.test.ts server/release.test.ts
          src/app/components.test.ts src/app/entry.test.ts
          src/app/features/tour/tour.test.ts src/game/browser-profile.test.ts
          src/game/career.test.ts src/game/living-world/vehicle-boarding.test.ts
