name: City browser acceptance

on:
  push:
    branches: ['codex/astra-browser-qa-20261011']
    paths:
      - '.github/workflows/city-browser-acceptance.yml'
      - 'scripts/journeys/map-shots.ts'
      - 'scripts/journeys/cdp-map-qa.ts'
      - 'scripts/journeys/serve-maps.ts'

permissions:
  contents: read

concurrency:
  group: city-browser-${{ github.sha }}
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: batch3
            app: 4fa9255599e4b9ff357bcfa9985f9ba64fba2bdb
            cities: dar-es-salaam,brazzaville,tunis,libreville,mbabane
            extra: --phone-ui-audit
    env:
      APP_SHA: ${{ matrix.app }}
      CITY_SET: ${{ matrix.cities }}
      AUDIT_EXTRA: ${{ matrix.extra }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.APP_SHA }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Record pinned sources
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/city-browser"
          test "$(git -C app rev-parse HEAD)" = "$APP_SHA"
          git -C app rev-parse HEAD > "$RUNNER_TEMP/city-browser/source.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/city-browser/diagnostic-source.txt"
          cp scripts/journeys/map-shots.ts scripts/journeys/serve-maps.ts scripts/journeys/cdp-map-qa.ts app/scripts/journeys/
          test -z "$(git -C app diff --name-only)"
      - working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck final layout candidate
        working-directory: app
        run: set -o pipefail; npm run typecheck 2>&1 | tee "$RUNNER_TEMP/city-browser/typecheck.log"
      - name: Focused map and travel checks
        working-directory: app
        run: set -o pipefail; node --experimental-strip-types --import ./scripts/node-scene-css.ts --test --test-reporter=tap --test-concurrency=1 src/map3d/map3d.test.ts src/app/features/travel/travelComponents.test.ts 2>&1 | tee "$RUNNER_TEMP/city-browser/map-checks.log"
      - working-directory: app
        run: npm run build
      - name: Verify final startup sizes
        working-directory: app
        run: set -o pipefail; npm run size:download 2>&1 | tee "$RUNNER_TEMP/city-browser/download.log"
      - name: Capture desktop and phone journeys
        working-directory: app
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node --experimental-strip-types scripts/journeys/map-shots.ts \
            --out "$RUNNER_TEMP/city-browser" --port 4423 --debug-port 4424 \
            --cities "$CITY_SET" --phone-cities "$CITY_SET" \
            --phones 390x844,320x568 --short lagos,abuja --lean --clock-hour 12 --label-audit $AUDIT_EXTRA \
            2>&1 | tee "$RUNNER_TEMP/city-browser/browser.log"
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const r=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/city-browser/timings.json","utf8")); if(r.aborted || r.consoleErrors?.length) throw Error(JSON.stringify({aborted:r.aborted,errors:r.consoleErrors}));'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: city-browser-${{ matrix.id }}-${{ env.APP_SHA }}
          path: ${{ runner.temp }}/city-browser/
