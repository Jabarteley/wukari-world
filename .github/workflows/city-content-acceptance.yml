name: City content acceptance

on:
  push:
    branches: ['codex/astra-city-content-20261011']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: city-content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: mkdir -p "$RUNNER_TEMP/content-logs"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: set -o pipefail; npm run typecheck 2>&1 | tee "$RUNNER_TEMP/content-logs/typecheck.log"
      - name: Build
        id: build
        run: set -o pipefail; npm run build 2>&1 | tee "$RUNNER_TEMP/content-logs/build.log"
      - name: Download and Worker budgets
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          npm run size:download 2>&1 | tee "$RUNNER_TEMP/content-logs/download.log"
          node --experimental-strip-types --test scripts/city/worker-content-budget.test.ts 2>&1 | tee "$RUNNER_TEMP/content-logs/worker-budget.log"
      - name: Complete Node suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: set -o pipefail; npm test 2>&1 | tee "$RUNNER_TEMP/content-logs/node.log"
      - name: Install Worker test runtime
        id: edge
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix deploy/tooling
      - name: Complete Worker suite
        if: ${{ !cancelled() && steps.edge.outcome == 'success' }}
        run: set -o pipefail; npm run test:edge 2>&1 | tee "$RUNNER_TEMP/content-logs/edge.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: content-gates-${{ github.sha }}
          path: ${{ runner.temp }}/content-logs/

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 78141cc0beef74585a1a720682ad81099def795d
          path: qa-drivers
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Capture current source with fixed browser drivers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/content-browser"
          git rev-parse HEAD > "$RUNNER_TEMP/content-browser/source.txt"
          cp qa-drivers/scripts/journeys/map-shots.ts scripts/journeys/map-shots.ts
          cp qa-drivers/scripts/journeys/serve-maps.ts scripts/journeys/serve-maps.ts
          cp qa-drivers/scripts/journeys/cdp-map-qa.ts scripts/journeys/cdp-map-qa.ts
          export CHROME_BIN="$(command -v google-chrome)"
          node --experimental-strip-types scripts/journeys/map-shots.ts \
            --out "$RUNNER_TEMP/content-browser" --port 4423 --debug-port 4424 \
            --cities lagos,abuja,cairo,dakar,yaounde \
            --phone-cities lagos,abuja,cairo,dakar,yaounde \
            --phones 390x844,320x568 --short lagos,abuja --lean --clock-hour 12 --label-audit \
            2>&1 | tee "$RUNNER_TEMP/content-browser/browser.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: content-browser-${{ github.sha }}
          path: ${{ runner.temp }}/content-browser/
