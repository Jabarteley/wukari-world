name: Pinned country boundary proof
on:
  push:
    branches: ['codex/astra-factory-qa-20261011']
    paths: ['scripts/geo/factory/bootstrap/boundary-request.json']
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: plan
        run: |
          matrix=$(python scripts/geo/factory/bootstrap/boundary-job.py --request scripts/geo/factory/bootstrap/boundary-request.json --plan)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  boundary:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned geometry dependencies
        run: python -m pip install --disable-pip-version-check --no-input 'osmium==4.3.1' 'shapely==2.1.2'
      - name: Verify and assemble country boundary
        run: python scripts/geo/factory/bootstrap/boundary-job.py --request scripts/geo/factory/bootstrap/boundary-request.json --country "${{ matrix.country }}" --out "$RUNNER_TEMP/country-boundary"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: country-boundary-${{ matrix.country }}-${{ github.sha }}
          path: ${{ runner.temp }}/country-boundary/publish
          if-no-files-found: error
