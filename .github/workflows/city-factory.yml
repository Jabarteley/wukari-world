name: One-table city factory

on:
  push:
    branches: ['codex/astra-factory-qa-20261011']
    paths: ['scripts/geo/factory/targets.json']

permissions:
  actions: read
  contents: read

concurrency:
  group: city-factory-${{ github.sha }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP_SHA: d5d85f4422afe11cef10468c255e5cae0084d45b
      FACTORY_SANDBOX: ${{ runner.temp }}/city-factory
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - id: input
        name: Validate single target and source pins
        run: node scripts/geo/factory/cloud-inputs.mjs scripts/geo/factory/targets.json
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d5d85f4422afe11cef10468c255e5cae0084d45b
          path: baseline
          persist-credentials: false
      - name: Verify producer receipt and checkout pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_JSON: ${{ steps.input.outputs.job_json }}
          OUT_DIR: ${{ runner.temp }}/city-factory/provenance
        run: |
          set -euo pipefail
          test "${{ steps.input.outputs.app_sha }}" = "$APP_SHA"
          test "$(git -C baseline rev-parse HEAD)" = "$APP_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$OUT_DIR"
          node scripts/geo/city-generation.mjs --source-run 2>&1 | tee "$OUT_DIR/source-run.log"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.input.outputs.source_run }}
          name: ${{ steps.input.outputs.source_artifact }}
          path: ${{ runner.temp }}/city-factory/extracts
      - name: Prepare separate disposable app
        run: |
          set -euo pipefail
          git clone --shared baseline "$FACTORY_SANDBOX/app"
          git -C "$FACTORY_SANDBOX/app" checkout --detach "$APP_SHA"
          printf '%s\n' '{"disposable":true}' > "$FACTORY_SANDBOX/app/.factory-disposable.json"
          npm ci --prefix "$FACTORY_SANDBOX/app" --ignore-scripts --no-audit --no-fund
          ln -s "$FACTORY_SANDBOX/app/node_modules" baseline/node_modules
      - name: Install Linux SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y librsvg2-bin
      - name: Execute bounded factory candidate
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/geo/factory/runner.mjs \
            --table scripts/geo/factory/targets.json \
            --source "$GITHUB_WORKSPACE/baseline" \
            --extract-root "$FACTORY_SANDBOX/extracts" \
            --proof-helper "$GITHUB_WORKSPACE/scripts/geo/city-generation-proof.mjs" \
            --receipt-helper "$GITHUB_WORKSPACE/scripts/geo/factory/integrate-city-receipts.mjs" \
            --helper-root "$GITHUB_WORKSPACE" \
            --workspace "$FACTORY_SANDBOX/app" \
            --sandbox-root "$FACTORY_SANDBOX" \
            --outdir "$FACTORY_SANDBOX/evidence" \
            --execute 2>&1 | tee "$FACTORY_SANDBOX/runner.log"
      - name: Collect generated source and diff
        if: always()
        env:
          TARGET_ID: ${{ steps.input.outputs.target_id }}
        run: |
          mkdir -p "$FACTORY_SANDBOX/delivery"
          if [ -d "$FACTORY_SANDBOX/app/.git" ]; then
            git -C "$FACTORY_SANDBOX/app" status --short > "$FACTORY_SANDBOX/delivery/git-status.txt"
            git -C "$FACTORY_SANDBOX/app" diff --binary HEAD > "$FACTORY_SANDBOX/delivery/generated.patch"
            cp -R "$FACTORY_SANDBOX/app/src/game/cities/$TARGET_ID" "$FACTORY_SANDBOX/delivery/"
            cp "$FACTORY_SANDBOX/app/scripts/geo/destination-detail/$TARGET_ID.ts" "$FACTORY_SANDBOX/delivery/"
            if [ -d "$FACTORY_SANDBOX/app/world/playable-africa-rollout" ]; then
              cp -R "$FACTORY_SANDBOX/app/world/playable-africa-rollout" "$FACTORY_SANDBOX/delivery/"
            fi
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: city-factory-${{ steps.input.outputs.target_id }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/city-factory/evidence
            ${{ runner.temp }}/city-factory/provenance
            ${{ runner.temp }}/city-factory/delivery
            ${{ runner.temp }}/city-factory/runner.log
          if-no-files-found: error
