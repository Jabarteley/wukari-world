name: Five city phone limits acceptance

on:
  push:
    branches: ['codex/astra-content-browser-qa-20261011']

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: dead3d477e6cc182e175d035d4ea3cd05532089c
          path: app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Verify application source and copy diagnostic drivers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/content-browser"
          test "$(git -C app rev-parse HEAD)" = dead3d477e6cc182e175d035d4ea3cd05532089c
          git -C app rev-parse HEAD > "$RUNNER_TEMP/content-browser/source.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/content-browser/diagnostic-source.txt"
          cp scripts/journeys/map-shots.ts scripts/journeys/serve-maps.ts scripts/journeys/cdp-map-qa.ts app/scripts/journeys/
          test -z "$(git -C app diff --name-only)"
      - working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund
      - working-directory: app
        run: npm run build
      - name: Capture desktop and phone maps
        working-directory: app
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node --experimental-strip-types scripts/journeys/map-shots.ts \
            --out "$RUNNER_TEMP/content-browser" --port 4423 --debug-port 4424 \
            --cities windhoek,maputo,gaborone,luanda,harare \
            --phone-cities windhoek,maputo,gaborone,luanda,harare \
            --phones 390x844,320x568 --short lagos --phone-limits-only --lean --clock-hour 12 --label-audit \
            2>&1 | tee "$RUNNER_TEMP/content-browser/browser.log"
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const report=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/content-browser/timings.json","utf8")); if(report.aborted || report.consoleErrors?.length) throw Error(JSON.stringify({aborted:report.aborted,errors:report.consoleErrors}));'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: content-browser-${{ github.sha }}
          path: ${{ runner.temp }}/content-browser/
