name: Five city release acceptance

on:
  push:
    branches: ['codex/astra-factory-qa-20261011']
    paths:
      - '.github/workflows/city-map-acceptance.yml'
      - 'scripts/journeys/map-shots.ts'
      - 'scripts/journeys/cdp-map-qa.ts'
      - 'scripts/journeys/serve-maps.ts'

permissions:
  contents: read

concurrency:
  group: five-city-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_SHA: bb9bf575df8cdb6159732c1cec0d76261c912ade
  CITY_SET: tripoli,bamako,ouagadougou,maseru,lilongwe

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.APP_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: mkdir -p "$RUNNER_TEMP/five-city-logs"
      - run: git rev-parse HEAD > "$RUNNER_TEMP/five-city-logs/source.txt"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: set -o pipefail; npm run typecheck 2>&1 | tee "$RUNNER_TEMP/five-city-logs/typecheck.log"
      - name: Build
        id: build
        run: set -o pipefail; npm run build 2>&1 | tee "$RUNNER_TEMP/five-city-logs/build.log"
      - name: Download size
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: set -o pipefail; npm run size:download 2>&1 | tee "$RUNNER_TEMP/five-city-logs/download.log"
      - name: Full Node suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        run: set -o pipefail; npm test 2>&1 | tee "$RUNNER_TEMP/five-city-logs/node.log"
      - name: Install Worker tooling
        id: tooling
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix deploy/tooling
      - name: Full Worker suite
        if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
        timeout-minutes: 30
        run: set -o pipefail; npm run test:edge 2>&1 | tee "$RUNNER_TEMP/five-city-logs/edge.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: five-city-gates-${{ env.APP_SHA }}
          path: ${{ runner.temp }}/five-city-logs/

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.APP_SHA }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Pin application and copy diagnostic drivers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/five-city-browser"
          test "$(git -C app rev-parse HEAD)" = "$APP_SHA"
          git -C app rev-parse HEAD > "$RUNNER_TEMP/five-city-browser/source.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/five-city-browser/diagnostic-source.txt"
          cp scripts/journeys/map-shots.ts scripts/journeys/serve-maps.ts scripts/journeys/cdp-map-qa.ts app/scripts/journeys/
          test -z "$(git -C app diff --name-only)"
      - working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund
      - working-directory: app
        run: npm run build
      - name: Capture all five cities on desktop and phones
        working-directory: app
        timeout-minutes: 35
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node --experimental-strip-types scripts/journeys/map-shots.ts \
            --out "$RUNNER_TEMP/five-city-browser" --port 4423 --debug-port 4424 \
            --cities "$CITY_SET" --phone-cities "$CITY_SET" \
            --phones 390x844,320x568 --short lagos --lean --clock-hour 12 --label-audit \
            2>&1 | tee "$RUNNER_TEMP/five-city-browser/browser.log"
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const report=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/five-city-browser/timings.json","utf8")); if(report.aborted || report.consoleErrors?.length) throw Error(JSON.stringify({aborted:report.aborted,errors:report.consoleErrors}));'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: five-city-browser-${{ env.APP_SHA }}
          path: ${{ runner.temp }}/five-city-browser/
