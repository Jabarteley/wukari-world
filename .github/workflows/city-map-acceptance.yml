name: Phone map label acceptance

on:
  push:
    branches: ['codex/astra-phone-qa-20261011']

permissions:
  contents: read

concurrency:
  group: phone-map-label-acceptance
  cancel-in-progress: false

env:
  APP_SHA: a34e41c205b84f60aa7c2628fbc5068dac497289

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Define runner artifact directories
        run: |
          echo "QA_LOG_DIR=$RUNNER_TEMP/city-map-acceptance/logs" >> "$GITHUB_ENV"
          echo "QA_BROWSER_DIR=$RUNNER_TEMP/city-map-acceptance/browser" >> "$GITHUB_ENV"

      - name: Check out the QA diagnostic checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: kromate/joinallworld
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out the frozen application source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: kromate/joinallworld
          ref: a34e41c205b84f60aa7c2628fbc5068dac497289
          path: app
          persist-credentials: false

      - name: Verify repository, source pins, and clean application checkout
        run: |
          set -euo pipefail
          mkdir -p "$QA_LOG_DIR" "$QA_BROWSER_DIR"
          test "$GITHUB_REPOSITORY" = "kromate/joinallworld"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C app rev-parse HEAD)" = "$APP_SHA"
          test -z "$(git -C app diff --name-only)"
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'diagnostic_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'application_sha=%s\n' "$(git -C app rev-parse HEAD)"
            printf 'expected_application_sha=%s\n' "$APP_SHA"
          } | tee "$QA_LOG_DIR/source.txt"

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0

      - name: Copy only the QA drivers into the frozen application checkout
        run: |
          set -euo pipefail
          mkdir -p app/scripts/journeys
          cp scripts/journeys/map-shots.ts app/scripts/journeys/map-shots.ts
          cp scripts/journeys/serve-maps.ts app/scripts/journeys/serve-maps.ts
          cp scripts/journeys/cdp-map-qa.ts app/scripts/journeys/cdp-map-qa.ts
          test -z "$(git -C app diff --name-only)"
          git -C app status --porcelain=v1 --untracked-files=all | tee "$QA_LOG_DIR/application-status.txt"
          test "$(git -C app status --porcelain=v1 --untracked-files=all | sort)" = "$(printf '%s\n' '?? scripts/journeys/cdp-map-qa.ts' '?? scripts/journeys/map-shots.ts' '?? scripts/journeys/serve-maps.ts' | sort)"

      - name: Install locked dependencies
        working-directory: app
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee "$QA_LOG_DIR/npm-ci.log"

      - name: Typecheck
        working-directory: app
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee "$QA_LOG_DIR/typecheck.log"

      - name: Build
        working-directory: app
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$QA_LOG_DIR/build.log"

      - name: Check download size
        working-directory: app
        run: |
          set -euo pipefail
          npm run size:download 2>&1 | tee "$QA_LOG_DIR/size-download.log"

      - name: Run focused map rendering checks
        id: focused
        working-directory: app
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-concurrency=1 \
            src/scene/city-scenes.test.ts \
            src/scene/scenes.test.ts \
            src/map3d/map3d.test.ts \
            src/map3d/camera.test.ts 2>&1 | tee "$QA_LOG_DIR/focused.log"

      - name: Capture frozen maps in the disposable browser
        working-directory: app
        timeout-minutes: 30
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          test -x "$CHROME_BIN"
          node --experimental-strip-types scripts/journeys/map-shots.ts \
            --out "$QA_BROWSER_DIR" \
            --port 4423 \
            --debug-port 4424 \
            --cities dakar,nairobi,abuja \
            --phone-cities dakar,nairobi \
            --phones 390x844,320x568 \
            --short lagos,abuja \
            --lean \
            --clock-hour 12 \
            --label-audit 2>&1 | tee "$QA_LOG_DIR/browser.log"

      - name: Preserve browser evidence before the full suite
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: city-browser-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/city-map-acceptance/browser/
            ${{ runner.temp }}/city-map-acceptance/logs/source.txt
            ${{ runner.temp }}/city-map-acceptance/logs/browser.log
          if-no-files-found: warn
          retention-days: 30

      - name: Run the complete literal npm test command
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        working-directory: app
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$QA_LOG_DIR/npm-test.log"

      - name: Preserve QA logs, source pins, and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phone-map-label-acceptance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/city-map-acceptance/logs/
            ${{ runner.temp }}/city-map-acceptance/browser/
          if-no-files-found: error
          retention-days: 30
