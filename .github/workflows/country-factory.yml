name: Country factory (table-driven)

# Factory candidate for one or more countries whose source batch already produced a table.
# Trigger: a push to this branch that touches the factory queue. Pushes that do not touch it start nothing.
# Queue: scripts/geo/factory/country-factory-queue.json  (see scripts/geo/factory/README-batch.md). A missing or empty queue is a no-op.
on:
  push:
    branches: ['claude/factory-20261012']
    paths: ['scripts/geo/factory/country-factory-queue.json']

permissions:
  actions: read
  contents: read

concurrency:
  group: country-factory-lane
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      count: ${{ steps.plan.outputs.count }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - id: plan
        name: Validate queue
        run: node scripts/geo/factory/country-queue.mjs --kind factory --queue scripts/geo/factory/country-factory-queue.json --github-output

  candidate:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Set execution directory
        run: |
          mkdir -p "$RUNNER_TEMP/city-factory"
          echo "FACTORY_SANDBOX=$RUNNER_TEMP/city-factory" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - id: input
        name: Validate bounded target table and source pins
        run: node scripts/geo/factory/cloud-inputs.mjs "${{ matrix.table }}"
      # The app baseline is the table's own expectedSourceGitSHA (written from the queue appSha by the source batch).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.input.outputs.app_sha }}
          path: baseline
          persist-credentials: false
      - name: Verify producers and download unique pinned artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = "${{ steps.input.outputs.app_sha }}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/geo/factory/cloud-sources.mjs \
            --table "${{ matrix.table }}" \
            --helper scripts/geo/city-generation.mjs \
            --download-root "$FACTORY_SANDBOX/downloads" \
            --extract-root "$FACTORY_SANDBOX/extracts" \
            --boundary-root "$FACTORY_SANDBOX/boundaries" \
            --outdir "$FACTORY_SANDBOX/provenance" \
            --sandbox-root "$FACTORY_SANDBOX"
      - name: Prepare separate disposable app
        run: |
          set -euo pipefail
          git clone --shared baseline "$FACTORY_SANDBOX/app"
          git -C "$FACTORY_SANDBOX/app" checkout --detach "${{ steps.input.outputs.app_sha }}"
          printf '%s\n' '{"disposable":true}' > "$FACTORY_SANDBOX/app/.factory-disposable.json"
          npm ci --prefix "$FACTORY_SANDBOX/app" --ignore-scripts --no-audit --no-fund
          ln -s "$FACTORY_SANDBOX/app/node_modules" baseline/node_modules
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned exact shoreline dependency
        run: python -m pip install --disable-pip-version-check --no-input 'shapely==2.1.2'
      - name: Install Linux SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y librsvg2-bin
      - name: Execute bounded factory candidate
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/geo/factory/runner.mjs \
            --table "${{ matrix.table }}" \
            --source "$GITHUB_WORKSPACE/baseline" \
            --extract-root "$FACTORY_SANDBOX/extracts" \
            --boundary-root "$FACTORY_SANDBOX/boundaries" \
            --proof-helper "$GITHUB_WORKSPACE/scripts/geo/city-generation-proof.mjs" \
            --receipt-helper "$GITHUB_WORKSPACE/scripts/geo/factory/integrate-city-receipts.mjs" \
            --helper-root "$GITHUB_WORKSPACE" \
            --workspace "$FACTORY_SANDBOX/app" \
            --sandbox-root "$FACTORY_SANDBOX" \
            --outdir "$FACTORY_SANDBOX/evidence" \
            --execute 2>&1 | tee "$FACTORY_SANDBOX/runner.log"
      - name: Collect generated source and diff for all targets
        if: always()
        run: |
          node scripts/geo/factory/cloud-sources.mjs \
            --table "${{ matrix.table }}" \
            --collect \
            --workspace "$FACTORY_SANDBOX/app" \
            --outdir "$FACTORY_SANDBOX/delivery" \
            --sandbox-root "$FACTORY_SANDBOX"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: city-factory-${{ matrix.id }}-${{ steps.input.outputs.target_count }}targets-${{ github.sha }}
          path: |
            ${{ runner.temp }}/city-factory/evidence
            ${{ runner.temp }}/city-factory/provenance
            ${{ runner.temp }}/city-factory/delivery
            ${{ runner.temp }}/city-factory/runner.log
          if-no-files-found: error
