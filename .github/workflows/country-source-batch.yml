name: Country source batch (table-driven)

# One reusable lane for every country: pinned Geofabrik PBF -> shared admin-0 boundary -> N city extracts.
# Trigger: a push to this branch that touches the queue file. Pushes that do not touch it start nothing.
# Queue: scripts/geo/factory/country-queue.json  (see scripts/geo/factory/README-batch.md). A missing or empty queue is a no-op.
on:
  push:
    branches: ['claude/factory-20261012']
    paths: ['scripts/geo/factory/country-queue.json']

permissions:
  contents: read

# One source lane for the whole repository: at most one run in progress. GitHub keeps only the newest
# pending run, so push one queue edit at a time (put several countries in one queue instead).
concurrency:
  group: country-source-lane
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      count: ${{ steps.plan.outputs.count }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - id: plan
        name: Validate queue and every seed table offline (no downloads)
        run: node scripts/geo/factory/country-queue.mjs --kind source --queue scripts/geo/factory/country-queue.json --github-output

  source:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    # A hung or oversized country frees the lane at this limit (Brazil-size sources exceeded 5 h and failed; split or hold those).
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Set source output directory
        run: echo "BOOTSTRAP_OUT=$RUNNER_TEMP/city-source-bootstrap" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a57e756a10b35a0eec9ec5928f083580fb9e7a9
          path: geometry-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Install pinned source and geometry dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input 'osmium==4.3.1' 'shapely==2.1.2'
          npm ci --prefix geometry-source --ignore-scripts --no-audit --no-fund
      - id: batch
        name: Download once, build boundary, extract all cities from the shared scans
        # Tables with countrySource.neighbours also download those same-snapshot Geofabrik extracts, verify bytes/MD5 and
        # merge them with the pinned pyosmium into one PBF before the boundary stage (bootstrap/source-merge.py, README-batch.md).
        run: |
          set +e
          python scripts/geo/factory/bootstrap/batch-run.py \
            --table "${{ matrix.table }}" \
            --geometry-source "$GITHUB_WORKSPACE/geometry-source" \
            --outdir "$BOOTSTRAP_OUT"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Emit factory table draft from this artifact (partial holds are excluded and named)
        if: always()
        run: |
          if [ -f "$BOOTSTRAP_OUT/publish/receipts/result.json" ]; then
            node --experimental-strip-types scripts/geo/factory/bootstrap/table.mjs \
              "$BOOTSTRAP_OUT/publish" "$BOOTSTRAP_OUT/publish/factory-table-draft.json" - "${{ matrix.appSha }}" \
              || echo "no factory table draft: every city is HOLD or the boundary is HOLD (see receipts/result.json)"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: city-bootstrap-${{ matrix.id }}-${{ github.sha }}
          path: ${{ runner.temp }}/city-source-bootstrap/publish
          if-no-files-found: error
      - name: Fail this lane entry when the batch held (the matrix still moves to the next country)
        if: steps.batch.outputs.code != '0'
        run: |
          echo "Source batch for ${{ matrix.id }} ended HOLD or failed (exit ${{ steps.batch.outputs.code }}); inspect receipts/result.json in the artifact."
          exit 1
