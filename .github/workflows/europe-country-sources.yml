name: Europe priority major-city source batches

on:
  push:
    branches: ['codex/world-europe-20261011']
    paths:
      - 'scripts/geo/factory/europe-ie.json'
      - 'scripts/geo/factory/europe-gr.json'
      - 'scripts/geo/factory/europe-nl.json'
      - 'scripts/geo/factory/europe-it-naples.json'
      - '.github/workflows/europe-country-sources.yml'

permissions:
  contents: read

concurrency:
  group: europe-country-source-batches
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      countries: ${{ steps.matrix.outputs.countries }}
    steps:
      - name: Compute changed country source matrix
        id: matrix
        env:
          API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          api_url = os.environ.get('API_URL', '').rstrip('/')
          repository = os.environ.get('GITHUB_REPOSITORY', '')
          head = os.environ.get('PUSH_HEAD', '')
          token = os.environ.get('GITHUB_TOKEN', '')
          countries = '[]'

          try:
              if not re.fullmatch(r'[0-9a-fA-F]{40}', head) or set(head) == {'0'}:
                  raise ValueError('push head must be a valid full commit SHA')
              if not re.fullmatch(r'[^/]+/[^/]+', repository):
                  raise ValueError('repository name is invalid')
              if not api_url.startswith('https://') or not token:
                  raise ValueError('GitHub API URL or token is unavailable')

              quoted_repo = urllib.parse.quote(repository, safe='/')
              commit_url = f'{api_url}/repos/{quoted_repo}/commits/{head}'
              request = urllib.request.Request(
                  commit_url,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  commit = json.load(response)

              if (
                  not isinstance(commit, dict)
                  or not isinstance(commit.get('sha'), str)
                  or commit['sha'].lower() != head.lower()
              ):
                  raise ValueError('commit response is missing or does not match the push SHA')
              files = commit.get('files')
              if not isinstance(files, list) or len(files) >= 300:
                  raise ValueError('commit file list is missing or may be truncated')

              paths = set()
              for item in files:
                  if not isinstance(item, dict) or not isinstance(item.get('filename'), str):
                      raise ValueError('commit response has an invalid file entry')
                  status = item.get('status')
                  if status not in ('added', 'modified', 'renamed', 'removed'):
                      raise ValueError('commit response has an invalid file status')
                  if status != 'removed':
                      paths.add(item['filename'])

              config_countries = {
                  'scripts/geo/factory/europe-nl.json': 'nl',
                  'scripts/geo/factory/europe-ie.json': 'ie',
                  'scripts/geo/factory/europe-gr.json': 'gr',
                  'scripts/geo/factory/europe-it-naples.json': 'it-naples',
              }
              selected = [country for path, country in config_countries.items() if path in paths]

              countries = json.dumps(list(dict.fromkeys(selected)), separators=(',', ':'))
          except (KeyError, TypeError, ValueError, json.JSONDecodeError, urllib.error.URLError, OSError) as error:
              countries = '[]'
              print(f'No source countries selected: {error}; skipping to avoid duplicate acquisition.')

          print(f'Source countries: {countries}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'countries={countries}\n')
          PY

  source:
    needs: changes
    if: ${{ needs.changes.outputs.countries != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        country: ${{ fromJSON(needs.changes.outputs.countries) }}
    steps:
      - name: Set source output directory
        run: echo "BOOTSTRAP_OUT=$RUNNER_TEMP/city-source-bootstrap" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a57e756a10b35a0eec9ec5928f083580fb9e7a9
          path: geometry-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Install pinned source and geometry dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input 'osmium==4.3.1' 'shapely==2.1.2'
          npm ci --prefix geometry-source --ignore-scripts --no-audit --no-fund
      - name: Download verified country source and derive metadata and layers
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/source-resource.txt" python scripts/geo/factory/bootstrap/batch-run.py \
            --table scripts/geo/factory/europe-${{ matrix.country }}.json \
            --geometry-source "$GITHUB_WORKSPACE/geometry-source" \
            --outdir "$BOOTSTRAP_OUT"
      - name: Preserve resource receipt
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/city-source-bootstrap/publish"
          if test -s "$RUNNER_TEMP/source-resource.txt"; then
            cp "$RUNNER_TEMP/source-resource.txt" "$RUNNER_TEMP/city-source-bootstrap/publish/source-resource.txt"
          else
            printf '%s\n' 'GNU time resource report was not produced or was empty.' > "$RUNNER_TEMP/city-source-bootstrap/publish/source-resource.txt"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: city-bootstrap-${{ matrix.country }}-${{ github.sha }}
          path: ${{ runner.temp }}/city-source-bootstrap/publish
          if-no-files-found: error
