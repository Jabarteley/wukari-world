name: Europe pinned United Kingdom source
on:
  push:
    branches: ['codex/world-europe-20261011']
    paths: ['scripts/geo/factory/europe-gb.json', '.github/workflows/europe-gb-source.yml']
permissions:
  contents: read
concurrency:
  group: europe-uk-source
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Set source output directory
        run: echo "BOOTSTRAP_OUT=$RUNNER_TEMP/city-source-bootstrap" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a57e756a10b35a0eec9ec5928f083580fb9e7a9
          path: geometry-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Install pinned source and geometry dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input 'osmium==4.3.1' 'shapely==2.1.2'
          npm ci --prefix geometry-source --ignore-scripts --no-audit --no-fund
      - name: Validate bounded request
        run: |
          python - <<'PYREQ'
          import json
          from pathlib import Path
          d=json.loads(Path('scripts/geo/factory/europe-gb.json').read_text())
          assert d['schemaVersion']==2 and len(d['seeds'])==1
          assert d['seeds'][0]['id']=='london' and d['seeds'][0]['countryISO']=='GB'
          assert d['countrySource']['bytes']==2267678857
          assert d['countrySource']['bytes']<=3000000000
          PYREQ
      - name: Derive exact country boundary, source metadata and layers
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/source-resource.txt" \
            python scripts/geo/factory/bootstrap/batch-run.py \
              --table scripts/geo/factory/europe-gb.json \
              --geometry-source "$GITHUB_WORKSPACE/geometry-source" \
              --outdir "$BOOTSTRAP_OUT"
      - name: Preserve resource receipt
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/city-source-bootstrap/publish"
          if test -f "$RUNNER_TEMP/source-resource.txt"; then
            cp "$RUNNER_TEMP/source-resource.txt" "$RUNNER_TEMP/city-source-bootstrap/publish/source-resource.txt"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: city-bootstrap-gb-${{ github.sha }}
          path: ${{ runner.temp }}/city-source-bootstrap/publish
          if-no-files-found: error
          retention-days: 14
