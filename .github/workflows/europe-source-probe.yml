name: Europe source probe
on:
  push:
    branches: ['codex/world-europe-20261011']
    paths:
      - 'scripts/geo/factory/europe-bootstrap.json'
      - '.github/workflows/europe-source-probe.yml'
permissions:
  contents: read
concurrency:
  group: europe-source-probe
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 81b993bbfb9afe96b5e5d0457ed090dbd7bd9214
          path: geometry-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Install pinned source and geometry dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input 'osmium==4.3.1' 'shapely==2.1.2'
          npm ci --prefix geometry-source --ignore-scripts --no-audit --no-fund
      - name: Verify bounded request
        run: |
          python - <<'PYREQ'
          import json
          from pathlib import Path
          d=json.loads(Path('scripts/geo/factory/europe-bootstrap.json').read_text())
          assert d['seed']['id'] == 'london' and d['seed']['countryISO'] == 'GB'
          assert d['countrySource']['bytes'] <= 3000000000
          assert d['geometrySourceSha'] == '81b993bbfb9afe96b5e5d0457ed090dbd7bd9214'
          PYREQ
      - name: Derive country boundary, metadata and source layers
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/source-resource.txt" \
            python scripts/geo/factory/bootstrap/run.py \
            --table scripts/geo/factory/europe-bootstrap.json \
            --geometry-source "$GITHUB_WORKSPACE/geometry-source" \
            --outdir "$RUNNER_TEMP/city-source-bootstrap"
      - name: Preserve resource receipt
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/city-source-bootstrap/publish"
          if test -f "$RUNNER_TEMP/source-resource.txt"; then
            cp "$RUNNER_TEMP/source-resource.txt" "$RUNNER_TEMP/city-source-bootstrap/publish/source-resource.txt"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: city-bootstrap-london-${{ github.sha }}
          path: ${{ runner.temp }}/city-source-bootstrap/publish
          if-no-files-found: error
          retention-days: 14
