name: North America Canada boundary resource diagnostic
on:
  push:
    branches: ['codex/world-north-america-20261011']
    paths: ['scripts/geo/north-america-source/canada-boundary.json', 'scripts/geo/north-america-source/canada-boundary-rerun.md', 'scripts/geo/north-america-source/canada-highest-point.patch', 'scripts/geo/north-america-source/canada-boundary-memory.patch', 'scripts/geo/north-america-source/boundary-run-monitor.py']
permissions:
  contents: read
concurrency:
  group: north-america-canada-boundary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  canada-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Initialize compact diagnostic artifact
        run: |
          mkdir -p "$RUNNER_TEMP/canada-boundary/publish/resources"
          printf '%s\n' '{"status":"HOLD","stage":"setup","reason":"Diagnostic has not completed"}' > "$RUNNER_TEMP/canada-boundary/publish/result.json"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0786c00510f2827d6495a53fc3299f3112d0d6b4
          path: boundary-tooling
          persist-credentials: false
      - name: Apply reviewed member correction and Canada disk-backed location caches
        run: |
          set -euo pipefail
          echo "99a7f9bb4934dd648e7843112fb7eb0d5e5194ae3417434e5d13aa7bbb5ea584  scripts/geo/north-america-source/canada-highest-point.patch" | sha256sum --check
          echo "dc235572e3e3bbfbcfffd44739b778af26e60dadb63a74b8702f375259c45ebb  scripts/geo/north-america-source/canada-boundary-memory.patch" | sha256sum --check
          test "$(git -C boundary-tooling rev-parse HEAD)" = "0786c00510f2827d6495a53fc3299f3112d0d6b4"
          git -C boundary-tooling apply "$GITHUB_WORKSPACE/scripts/geo/north-america-source/canada-boundary-memory.patch"
          git -C boundary-tooling apply "$GITHUB_WORKSPACE/scripts/geo/north-america-source/canada-highest-point.patch"
          grep -Fq "idx=f'sparse_file_array,{ways_location_index}'" boundary-tooling/scripts/geo/factory/bootstrap/country-boundary.py
          grep -Fq ".with_locations(storage=f'sparse_file_array,{areas_location_index}')" boundary-tooling/scripts/geo/factory/bootstrap/country-boundary.py
          grep -Fq "(args.country == 'CA' and relation['id'] == 1428125 and member['ref'] == 618700710) or (args.country == 'US' and relation['id'] == 148838 and member['ref'] == 2748929230)" boundary-tooling/scripts/geo/factory/bootstrap/country-boundary.py
          grep -Fq "iso === 'CA' && relation.id === 1428125 && member.ref === 618700710 || iso === 'US' && relation.id === 148838 && member.ref === 2748929230" boundary-tooling/scripts/geo/factory/country-scope.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned geometry dependencies
        run: python -m pip install --disable-pip-version-check --no-input 'osmium==4.3.1' 'shapely==2.1.2'
      - name: Verify pins and measure available runner resources
        run: |
          df -B1 "$RUNNER_TEMP" > "$RUNNER_TEMP/canada-boundary/publish/resources/disk-before.txt"
          free -b > "$RUNNER_TEMP/canada-boundary/publish/resources/memory-before.txt"
          python - <<'PY'
          import hashlib, json, osmium, os, shutil, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'canada-boundary'
          publish = root / 'publish'
          result = {'status': 'HOLD', 'stage': 'preflight'}
          try:
              path = Path('scripts/geo/north-america-source/canada-boundary.json')
              request = json.loads(path.read_text())
              expected = {'schemaVersion': 1, 'countryISO': 'CA', 'sourceUrl': 'https://download.geofabrik.de/north-america/canada-261009.osm.pbf', 'snapshotDate': '2026-10-09', 'bytes': 6521324534, 'md5': '17c5b6085a0d804b24a909926ef8d9fc'}
              if request != expected:
                  raise ValueError('Canada request differs from exact reviewed source pins')
              tooling = subprocess.check_output(['git', '-C', 'boundary-tooling', 'rev-parse', 'HEAD'], text=True).strip()
              if tooling != '0786c00510f2827d6495a53fc3299f3112d0d6b4':
                  raise ValueError('boundary tooling checkout mismatch')
              index_types = osmium.index.map_types()
              if 'sparse_file_array' not in index_types:
                  raise ValueError('pinned pyosmium does not provide sparse_file_array')
              disk = shutil.disk_usage(root)
              reserve = 24 * 1024 ** 3
              proof = {'schemaVersion': 1, 'runnerOS': os.environ.get('RUNNER_OS'), 'runnerArch': os.environ.get('RUNNER_ARCH'), 'imageOS': os.environ.get('ImageOS'), 'imageVersion': os.environ.get('ImageVersion'), 'runId': os.environ['GITHUB_RUN_ID'], 'producerSha': os.environ['GITHUB_SHA'], 'toolingSha': tooling, 'rolePatchSha256': hashlib.sha256(Path('scripts/geo/north-america-source/canada-highest-point.patch').read_bytes()).hexdigest(), 'memoryPatchSha256': hashlib.sha256(Path('scripts/geo/north-america-source/canada-boundary-memory.patch').read_bytes()).hexdigest(), 'locationIndexType': 'sparse_file_array', 'availableLocationIndexTypes': index_types, 'assembledHelperSha256': hashlib.sha256((Path('boundary-tooling/scripts/geo/factory/bootstrap/country-boundary.py')).read_bytes()).hexdigest(), 'receiptVerifierSha256': hashlib.sha256(Path('boundary-tooling/scripts/geo/factory/country-scope.mjs').read_bytes()).hexdigest(), 'requestSha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'diskTotalBytes': disk.total, 'diskFreeBytes': disk.free, 'requiredSourceBytes': request['bytes'], 'reserveBytes': reserve, 'downloadBudgetSeconds': 1800, 'boundaryBudgetSeconds': 2700}
              (publish / 'resources/preflight.json').write_text(json.dumps(proof, indent=2) + '\n')
              if disk.free < request['bytes'] + reserve:
                  raise ValueError(f'insufficient free disk: {disk.free}; require {request["bytes"] + reserve} bytes including 24GiB location-index reserve')
              result.update(status='PREFLIGHT_PASSED', reason='Exact pins/tooling and measured disk preflight passed')
          except Exception as error:
              result['reason'] = str(error)
          (publish / 'result.json').write_text(json.dumps(result, indent=2) + '\n')
          if result['status'] != 'PREFLIGHT_PASSED':
              raise SystemExit(result['reason'])
          PY
      - name: Download once and verify source within 30 minutes
        id: download
        continue-on-error: true
        run: |
          set +e
          /usr/bin/time -v -o "$RUNNER_TEMP/canada-boundary/publish/resources/download-time.txt" timeout --signal=TERM --kill-after=30s 30m python - <<'PY' > "$RUNNER_TEMP/canada-boundary/publish/resources/download.log" 2>&1
          import hashlib, json, os, time
          from pathlib import Path
          from urllib.request import urlopen
          root = Path(os.environ['RUNNER_TEMP']) / 'canada-boundary'
          publish = root / 'publish'
          request = json.loads(Path('scripts/geo/north-america-source/canada-boundary.json').read_text())
          result = {'status': 'HOLD', 'stage': 'download', 'reason': 'Download/hash verification did not complete'}
          (publish / 'result.json').write_text(json.dumps(result, indent=2) + '\n')
          started = time.monotonic()
          try:
              md5, sha, size = hashlib.md5(), hashlib.sha256(), 0
              with urlopen(request['sourceUrl'], timeout=90) as response, (root / 'country.osm.pbf').open('wb') as output:
                  http = {'requestedUrl': request['sourceUrl'], 'resolvedUrl': response.url, 'lastModified': response.headers.get('Last-Modified')}
                  while True:
                      block = response.read(1024 * 1024)
                      if not block:
                          break
                      size += len(block)
                      if size > request['bytes']:
                          raise ValueError('download exceeds pinned byte count')
                      output.write(block)
                      md5.update(block); sha.update(block)
              if size != request['bytes'] or md5.hexdigest() != request['md5']:
                  raise ValueError(f'PBF byte/MD5 mismatch: bytes={size}, md5={md5.hexdigest()}')
              receipt = {**request, 'status': 'SOURCE_VERIFIED', 'actualBytes': size, 'actualMd5': md5.hexdigest(), 'sha256': sha.hexdigest(), 'http': http, 'elapsedSeconds': time.monotonic() - started}
              (publish / 'source-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
              result.update(status='SOURCE_VERIFIED', reason='Exact downloaded bytes/MD5 verified and SHA256 computed')
          except Exception as error:
              result['reason'] = str(error)
          (publish / 'result.json').write_text(json.dumps(result, indent=2) + '\n')
          if result['status'] != 'SOURCE_VERIFIED':
              raise SystemExit(result['reason'])
          PY
          diagnostic_rc=$?
          printf '%s\n' "$diagnostic_rc" > "$RUNNER_TEMP/canada-boundary/publish/resources/download-exit.txt"
          exit "$diagnostic_rc"
      - name: Preserve verified-source pre-boundary snapshot
        if: steps.download.outcome == 'success'
        run: |
          set -euo pipefail
          python scripts/geo/north-america-source/boundary-run-monitor.py \
            --root "$RUNNER_TEMP/canada-boundary" \
            --output "$RUNNER_TEMP/canada-boundary/publish/resources/pre-boundary.jsonl"
          mkdir -p "$RUNNER_TEMP/canada-boundary/pre-boundary"
          cp "$RUNNER_TEMP/canada-boundary/publish/result.json" "$RUNNER_TEMP/canada-boundary/pre-boundary/"
          cp "$RUNNER_TEMP/canada-boundary/publish/source-receipt.json" "$RUNNER_TEMP/canada-boundary/pre-boundary/"
          cp "$RUNNER_TEMP/canada-boundary/publish/resources/preflight.json" "$RUNNER_TEMP/canada-boundary/pre-boundary/"
          cp "$RUNNER_TEMP/canada-boundary/publish/resources/disk-before.txt" "$RUNNER_TEMP/canada-boundary/pre-boundary/"
          cp "$RUNNER_TEMP/canada-boundary/publish/resources/memory-before.txt" "$RUNNER_TEMP/canada-boundary/pre-boundary/"
          cp "$RUNNER_TEMP/canada-boundary/publish/resources/download-time.txt" "$RUNNER_TEMP/canada-boundary/pre-boundary/"
          cp "$RUNNER_TEMP/canada-boundary/publish/resources/pre-boundary.jsonl" "$RUNNER_TEMP/canada-boundary/pre-boundary/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.download.outcome == 'success'
        with:
          name: north-america-canada-pre-boundary-${{ github.sha }}
          path: ${{ runner.temp }}/canada-boundary/pre-boundary
          if-no-files-found: error
          retention-days: 14
      - name: Prove exact same-source boundary within 45 minutes
        id: boundary
        if: steps.download.outcome == 'success'
        continue-on-error: true
        run: |
          set -uo pipefail
          monitor_pid=''
          boundary_pid=''
          capture_signal() {
            signal_name="$1"
            printf '%s\n' "$signal_name" > "$RUNNER_TEMP/canada-boundary/publish/resources/boundary-signal.txt"
            printf 'utc=%s bash_pid=%s boundary_pid=%s monitor_pid=%s\n' "$(date -u +%FT%TZ)" "$$" "${boundary_pid:-}" "${monitor_pid:-}" \
              > "$RUNNER_TEMP/canada-boundary/publish/resources/boundary-signal-context.txt"
            printf 'DIAG_SIGNAL signal=%s utc=%s bash_pid=%s boundary_pid=%s monitor_pid=%s\n' "$signal_name" "$(date -u +%FT%TZ)" "$$" "${boundary_pid:-}" "${monitor_pid:-}"
            if [[ -n "$monitor_pid" ]]; then kill -TERM "$monitor_pid" 2>/dev/null || true; fi
            if [[ -n "$boundary_pid" ]]; then kill -TERM "$boundary_pid" 2>/dev/null || true; fi
          }
          trap 'capture_signal SIGTERM' TERM
          trap 'capture_signal SIGINT' INT
          source_sha=$(python -c 'import json,os; from pathlib import Path; print(json.loads((Path(os.environ["RUNNER_TEMP"])/"canada-boundary/publish/source-receipt.json").read_text())["sha256"])')
          printf 'DIAG_BOUNDARY_START utc=%s bash_pid=%s source_sha256=%s\n' "$(date -u +%FT%TZ)" "$$" "$source_sha"
          /usr/bin/time -v -o "$RUNNER_TEMP/canada-boundary/publish/resources/boundary-time.txt" timeout --signal=TERM --kill-after=30s 45m \
            python boundary-tooling/scripts/geo/factory/bootstrap/country-boundary.py \
            --pbf "$RUNNER_TEMP/canada-boundary/country.osm.pbf" --country CA \
            --expected-sha256 "$source_sha" --expected-bytes 6521324534 \
            --dataset-url https://download.geofabrik.de/north-america/canada-261009.osm.pbf \
            --dataset-date 2026-10-09 --out "$RUNNER_TEMP/canada-boundary/publish/boundary" \
            > "$RUNNER_TEMP/canada-boundary/publish/resources/boundary.log" 2>&1 &
          boundary_pid=$!
          python scripts/geo/north-america-source/boundary-run-monitor.py \
            --root "$RUNNER_TEMP/canada-boundary" --pid "$boundary_pid" --interval 5 \
            --output "$RUNNER_TEMP/canada-boundary/publish/resources/boundary-samples.jsonl" --mirror-stdout &
          monitor_pid=$!
          wait "$boundary_pid"
          diagnostic_rc=$?
          wait "$monitor_pid" || true
          printf '%s\n' "$diagnostic_rc" > "$RUNNER_TEMP/canada-boundary/publish/resources/boundary-exit.txt"
          exit "$diagnostic_rc"
      - name: Preserve measured result and precise HOLD on failure
        if: always()
        run: |
          df -B1 "$RUNNER_TEMP" > "$RUNNER_TEMP/canada-boundary/publish/resources/disk-after.txt"
          free -b > "$RUNNER_TEMP/canada-boundary/publish/resources/memory-after.txt"
          python - <<'PY'
          import json, os
          from pathlib import Path
          publish = Path(os.environ['RUNNER_TEMP']) / 'canada-boundary/publish'
          result_path = publish / 'result.json'
          result = json.loads(result_path.read_text())
          try:
              for stage in ('download', 'boundary'):
                  exit_path = publish / 'resources' / (stage + '-exit.txt')
                  if not exit_path.exists():
                      if result['status'] == 'HOLD':
                          raise ValueError(result['reason'])
                      raise ValueError(stage + ' stage was not executed or did not finish')
                  code = int(exit_path.read_text())
                  if code:
                      detail = ('30-minute download budget' if stage == 'download' else '45-minute boundary budget') + ' exceeded' if code == 124 else f'{stage} exited {code}; inspect resources/{stage}.log'
                      if stage == 'boundary' and (publish / 'boundary/result.json').exists():
                          detail += ': ' + json.loads((publish / 'boundary/result.json').read_text()).get('reason', 'boundary HOLD')
                      elif stage == 'download' and result['status'] == 'HOLD':
                          detail += ': ' + result['reason']
                      result['stage'] = stage
                      raise ValueError(detail)
              receipt = json.loads((publish / 'boundary/receipt.json').read_text())
              source = json.loads((publish / 'source-receipt.json').read_text())
              if receipt['status'] != 'OSM_COUNTRY_BOUNDARY_CANDIDATE' or receipt['countryISO'] != 'CA' or receipt['source']['sha256'] != source['sha256'] or receipt['source']['bytes'] != source['actualBytes']:
                  raise ValueError('boundary candidate country/status/same-PBF linkage mismatch')
              result.update(status='OSM_COUNTRY_BOUNDARY_CANDIDATE', stage='complete', reason='Measured same-source boundary diagnostic completed', pbfSha256=source['sha256'], limitations=['No fixtures or Toronto extraction executed', 'Factory, containment/browser acceptance and live state remain unproved'])
          except Exception as error:
              result.update(status='HOLD', reason=str(error))
          result_path.write_text(json.dumps(result, indent=2) + '\n')
          if result['status'] == 'HOLD':
              raise SystemExit(result['reason'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: north-america-canada-boundary-${{ github.sha }}
          path: ${{ runner.temp }}/canada-boundary/publish
          if-no-files-found: error
          retention-days: 14
