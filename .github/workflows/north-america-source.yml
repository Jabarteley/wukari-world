name: North America pinned Mexico boundary source
on:
  push:
    branches: ['codex/world-north-america-20261011']
    paths: ['scripts/geo/north-america-source/requests.json']
permissions:
  contents: read
concurrency:
  group: north-america-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mexico-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0786c00510f2827d6495a53fc3299f3112d0d6b4
          path: boundary-tooling
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate bounded request before network acquisition
        run: python scripts/geo/north-america-source/acquire.py --request scripts/geo/north-america-source/requests.json --validate-only
      - name: Install pinned geometry dependencies
        run: python -m pip install --disable-pip-version-check --no-input 'osmium==4.3.1' 'shapely==2.1.2'
      - name: Download once and prove complete same-source Mexico boundary
        run: >-
          python scripts/geo/north-america-source/acquire.py
          --request scripts/geo/north-america-source/requests.json
          --tooling boundary-tooling
          --out "$RUNNER_TEMP/north-america-source"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: north-america-source-${{ github.sha }}
          path: ${{ runner.temp }}/north-america-source/publish
          if-no-files-found: error
          retention-days: 14
