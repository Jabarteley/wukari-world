name: North America US boundary resource diagnostic
on:
  push:
    branches: ['codex/world-north-america-20261011']
    paths: ['scripts/geo/north-america-source/us-boundary.json', 'scripts/geo/north-america-source/canada-highest-point.patch', 'scripts/geo/north-america-source/canada-boundary-memory.patch', 'scripts/geo/north-america-source/boundary-run-monitor.py', 'scripts/geo/north-america-source/extract-boundary-closure.py', 'scripts/geo/north-america-source/rebind-boundary-closure-receipt.py', '.github/workflows/north-america-us-boundary.yml']
permissions:
  contents: read
concurrency:
  group: north-america-us-boundary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  us-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Initialize compact diagnostic artifact
        run: |
          mkdir -p "$RUNNER_TEMP/us-boundary/publish/resources"
          printf '%s\n' '{"status":"HOLD","stage":"setup","reason":"Diagnostic has not completed"}' > "$RUNNER_TEMP/us-boundary/publish/result.json"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0786c00510f2827d6495a53fc3299f3112d0d6b4
          path: boundary-tooling
          persist-credentials: false
      - name: Apply the reviewed auxiliary-node role rule and disk-backed location indexes
        run: |
          set -euo pipefail
          echo "99a7f9bb4934dd648e7843112fb7eb0d5e5194ae3417434e5d13aa7bbb5ea584  scripts/geo/north-america-source/canada-highest-point.patch" | sha256sum --check
          echo "dc235572e3e3bbfbcfffd44739b778af26e60dadb63a74b8702f375259c45ebb  scripts/geo/north-america-source/canada-boundary-memory.patch" | sha256sum --check
          test "$(git -C boundary-tooling rev-parse HEAD)" = "0786c00510f2827d6495a53fc3299f3112d0d6b4"
          git -C boundary-tooling apply "$GITHUB_WORKSPACE/scripts/geo/north-america-source/canada-boundary-memory.patch"
          git -C boundary-tooling apply "$GITHUB_WORKSPACE/scripts/geo/north-america-source/canada-highest-point.patch"
          grep -Fq "idx=f'sparse_file_array,{ways_location_index}'" boundary-tooling/scripts/geo/factory/bootstrap/country-boundary.py
          grep -Fq ".with_locations(storage=f'sparse_file_array,{areas_location_index}')" boundary-tooling/scripts/geo/factory/bootstrap/country-boundary.py
          grep -Fq "(args.country == 'CA' and relation['id'] == 1428125 and member['ref'] == 618700710) or (args.country == 'US' and relation['id'] == 148838 and member['ref'] == 2748929230)" boundary-tooling/scripts/geo/factory/bootstrap/country-boundary.py
          grep -Fq "iso === 'CA' && relation.id === 1428125 && member.ref === 618700710 || iso === 'US' && relation.id === 148838 && member.ref === 2748929230" boundary-tooling/scripts/geo/factory/country-scope.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned Osmium Tool from Ubuntu Noble
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends osmium-tool=1.16.0-1build1
          osmium --version > "$RUNNER_TEMP/us-boundary/publish/resources/osmium-version.txt"
          test "$(head -n 1 "$RUNNER_TEMP/us-boundary/publish/resources/osmium-version.txt")" = 'osmium version 1.16.0'
      - name: Install pinned geometry dependencies
        run: python -m pip install --disable-pip-version-check --no-input 'osmium==4.3.1' 'shapely==2.1.2'
      - name: Verify pins and measure available runner resources
        run: |
          df -B1 "$RUNNER_TEMP" > "$RUNNER_TEMP/us-boundary/publish/resources/disk-before.txt"
          free -b > "$RUNNER_TEMP/us-boundary/publish/resources/memory-before.txt"
          python - <<'PY'
          import hashlib, json, osmium, os, shutil, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'us-boundary'
          publish = root / 'publish'
          result = {'status': 'HOLD', 'stage': 'preflight'}
          try:
              path = Path('scripts/geo/north-america-source/us-boundary.json')
              request = json.loads(path.read_text())
              expected = {'schemaVersion': 1, 'countryISO': 'US', 'sourceUrl': 'https://download.geofabrik.de/north-america/us-261009.osm.pbf', 'snapshotDate': '2026-10-09', 'bytes': 12196456372, 'md5': '0befc76d07878c8a68f1ed85948ea7a9'}
              if request != expected:
                  raise ValueError('US request differs from the exact reviewed source pins')
              tooling = subprocess.check_output(['git', '-C', 'boundary-tooling', 'rev-parse', 'HEAD'], text=True).strip()
              if tooling != '0786c00510f2827d6495a53fc3299f3112d0d6b4':
                  raise ValueError('boundary tooling checkout mismatch')
              patch_path = Path('scripts/geo/north-america-source/canada-highest-point.patch')
              patch_sha = hashlib.sha256(patch_path.read_bytes()).hexdigest()
              if patch_sha != '99a7f9bb4934dd648e7843112fb7eb0d5e5194ae3417434e5d13aa7bbb5ea584':
                  raise ValueError('auxiliary-node role patch digest mismatch')
              memory_patch_path = Path('scripts/geo/north-america-source/canada-boundary-memory.patch')
              memory_patch_sha = hashlib.sha256(memory_patch_path.read_bytes()).hexdigest()
              if memory_patch_sha != 'dc235572e3e3bbfbcfffd44739b778af26e60dadb63a74b8702f375259c45ebb':
                  raise ValueError('disk-backed location-index patch digest mismatch')
              index_types = osmium.index.map_types()
              if 'sparse_file_array' not in index_types:
                  raise ValueError('pinned pyosmium does not provide sparse_file_array')
              osmium_version_output = subprocess.check_output(['osmium', '--version'], text=True).strip()
              osmium_version_lines = osmium_version_output.splitlines()
              osmium_version = osmium_version_lines[0] if osmium_version_lines else ''
              if osmium_version != 'osmium version 1.16.0':
                  raise ValueError(f'Osmium Tool version mismatch: {osmium_version_output}')
              disk = shutil.disk_usage(root)
              reserve = 24 * 1024 ** 3
              proof = {'schemaVersion': 1, 'runnerOS': os.environ.get('RUNNER_OS'), 'runnerArch': os.environ.get('RUNNER_ARCH'), 'imageOS': os.environ.get('ImageOS'), 'imageVersion': os.environ.get('ImageVersion'), 'runId': os.environ['GITHUB_RUN_ID'], 'producerSha': os.environ['GITHUB_SHA'], 'toolingSha': tooling, 'rolePatchSha256': patch_sha, 'memoryPatchSha256': memory_patch_sha, 'osmiumToolVersion': osmium_version, 'osmiumToolVersionOutput': osmium_version_output, 'closureExtractorSha256': hashlib.sha256(Path('scripts/geo/north-america-source/extract-boundary-closure.py').read_bytes()).hexdigest(), 'receiptAdapterSha256': hashlib.sha256(Path('scripts/geo/north-america-source/rebind-boundary-closure-receipt.py').read_bytes()).hexdigest(), 'locationIndexType': 'sparse_file_array', 'availableLocationIndexTypes': index_types, 'assembledHelperSha256': hashlib.sha256(Path('boundary-tooling/scripts/geo/factory/bootstrap/country-boundary.py').read_bytes()).hexdigest(), 'receiptVerifierSha256': hashlib.sha256(Path('boundary-tooling/scripts/geo/factory/country-scope.mjs').read_bytes()).hexdigest(), 'requestSha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'diskTotalBytes': disk.total, 'diskFreeBytes': disk.free, 'availableMemoryBytes': None, 'requiredSourceBytes': request['bytes'], 'reserveBytes': reserve, 'downloadBudgetSeconds': 1800, 'closureBudgetSeconds': 2100, 'boundaryBudgetSeconds': 900}
              memory = Path(publish / 'resources/memory-before.txt').read_text()
              for line in memory.splitlines():
                  if line.startswith('Mem:'):
                      parts = line.split()
                      if len(parts) >= 7:
                          proof['availableMemoryBytes'] = int(parts[6])
                      break
              (publish / 'resources/preflight.json').write_text(json.dumps(proof, indent=2) + '\n')
              if disk.free < request['bytes'] + reserve:
                  raise ValueError(f'insufficient free disk: {disk.free}; require {request["bytes"] + reserve} bytes including 24 GiB for source and closure extraction')
              result.update(status='PREFLIGHT_PASSED', reason='Exact pins/tooling and measured disk preflight passed')
          except Exception as error:
              result['reason'] = str(error)
          (publish / 'result.json').write_text(json.dumps(result, indent=2) + '\n')
          if result['status'] != 'PREFLIGHT_PASSED':
              raise SystemExit(result['reason'])
          PY
      - name: Download once and verify source within 30 minutes
        id: download
        continue-on-error: true
        run: |
          set +e
          /usr/bin/time -v -o "$RUNNER_TEMP/us-boundary/publish/resources/download-time.txt" timeout --signal=TERM --kill-after=30s 30m python - <<'PY' > "$RUNNER_TEMP/us-boundary/publish/resources/download.log" 2>&1
          import hashlib, json, os, time
          from pathlib import Path
          from urllib.request import urlopen
          root = Path(os.environ['RUNNER_TEMP']) / 'us-boundary'
          publish = root / 'publish'
          request = json.loads(Path('scripts/geo/north-america-source/us-boundary.json').read_text())
          result = {'status': 'HOLD', 'stage': 'download', 'reason': 'Download/hash verification did not complete'}
          (publish / 'result.json').write_text(json.dumps(result, indent=2) + '\n')
          started = time.monotonic()
          try:
              md5, sha, size = hashlib.md5(), hashlib.sha256(), 0
              with urlopen(request['sourceUrl'], timeout=90) as response, (root / 'country.osm.pbf').open('wb') as output:
                  http = {'requestedUrl': request['sourceUrl'], 'resolvedUrl': response.url, 'lastModified': response.headers.get('Last-Modified')}
                  while True:
                      block = response.read(1024 * 1024)
                      if not block:
                          break
                      size += len(block)
                      if size > request['bytes']:
                          raise ValueError('download exceeds pinned byte count')
                      output.write(block)
                      md5.update(block)
                      sha.update(block)
              if size != request['bytes'] or md5.hexdigest() != request['md5']:
                  raise ValueError(f'PBF byte/MD5 mismatch: bytes={size}, md5={md5.hexdigest()}')
              receipt = {**request, 'status': 'SOURCE_VERIFIED', 'actualBytes': size, 'actualMd5': md5.hexdigest(), 'sha256': sha.hexdigest(), 'http': http, 'elapsedSeconds': time.monotonic() - started}
              (publish / 'source-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
              result.update(status='SOURCE_VERIFIED', reason='Exact downloaded bytes/MD5 verified and SHA-256 computed')
          except Exception as error:
              result['reason'] = str(error)
          (publish / 'result.json').write_text(json.dumps(result, indent=2) + '\n')
          if result['status'] != 'SOURCE_VERIFIED':
              raise SystemExit(result['reason'])
          PY
          diagnostic_rc=$?
          printf '%s\n' "$diagnostic_rc" > "$RUNNER_TEMP/us-boundary/publish/resources/download-exit.txt"
          exit "$diagnostic_rc"
      - name: Preserve verified-source pre-boundary snapshot
        if: steps.download.outcome == 'success'
        run: |
          set -euo pipefail
          python scripts/geo/north-america-source/boundary-run-monitor.py \
            --root "$RUNNER_TEMP/us-boundary" \
            --output "$RUNNER_TEMP/us-boundary/publish/resources/pre-boundary.jsonl"
          mkdir -p "$RUNNER_TEMP/us-boundary/pre-boundary"
          cp "$RUNNER_TEMP/us-boundary/publish/result.json" "$RUNNER_TEMP/us-boundary/pre-boundary/"
          cp "$RUNNER_TEMP/us-boundary/publish/source-receipt.json" "$RUNNER_TEMP/us-boundary/pre-boundary/"
          cp "$RUNNER_TEMP/us-boundary/publish/resources/preflight.json" "$RUNNER_TEMP/us-boundary/pre-boundary/"
          cp "$RUNNER_TEMP/us-boundary/publish/resources/disk-before.txt" "$RUNNER_TEMP/us-boundary/pre-boundary/"
          cp "$RUNNER_TEMP/us-boundary/publish/resources/memory-before.txt" "$RUNNER_TEMP/us-boundary/pre-boundary/"
          cp "$RUNNER_TEMP/us-boundary/publish/resources/download-time.txt" "$RUNNER_TEMP/us-boundary/pre-boundary/"
          cp "$RUNNER_TEMP/us-boundary/publish/resources/pre-boundary.jsonl" "$RUNNER_TEMP/us-boundary/pre-boundary/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.download.outcome == 'success'
        with:
          name: north-america-us-pre-boundary-${{ github.sha }}
          path: ${{ runner.temp }}/us-boundary/pre-boundary
          if-no-files-found: error
          retention-days: 14
      - name: Extract the exact US boundary member closure within 35 minutes
        id: closure
        if: steps.download.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          monitor_pid=''
          stage_pid=''
          stage=closure
          printf '%s\n' "$(date -u +%FT%TZ)" > "$RUNNER_TEMP/us-boundary/publish/resources/closure-start.txt"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'us-boundary/publish/result.json'
          result = json.loads(path.read_text())
          result.update(status='HOLD', stage='closure', reason='Exact boundary member closure has not completed')
          path.write_text(json.dumps(result, indent=2) + '\n')
          PY
          record_exit() {
            code=$?
            printf '%s\n' "$code" > "$RUNNER_TEMP/us-boundary/publish/resources/${stage}-exit.txt"
          }
          trap record_exit EXIT
          capture_signal() {
            signal_name="$1"
            printf '%s\n' "$signal_name" > "$RUNNER_TEMP/us-boundary/publish/resources/${stage}-signal.txt"
            printf 'utc=%s bash_pid=%s stage_pid=%s monitor_pid=%s\n' "$(date -u +%FT%TZ)" "$$" "${stage_pid:-}" "${monitor_pid:-}" \
              > "$RUNNER_TEMP/us-boundary/publish/resources/${stage}-signal-context.txt"
            printf 'DIAG_SIGNAL stage=%s signal=%s utc=%s bash_pid=%s stage_pid=%s monitor_pid=%s\n' "$stage" "$signal_name" "$(date -u +%FT%TZ)" "$$" "${stage_pid:-}" "${monitor_pid:-}"
            if [[ -n "$monitor_pid" ]]; then kill -TERM "$monitor_pid" 2>/dev/null || true; fi
            if [[ -n "$stage_pid" ]]; then kill -TERM "$stage_pid" 2>/dev/null || true; fi
            exit 143
          }
          trap 'capture_signal SIGTERM' TERM
          trap 'capture_signal SIGINT' INT
          source_sha=$(python -c 'import json,os; from pathlib import Path; print(json.loads((Path(os.environ["RUNNER_TEMP"])/"us-boundary/publish/source-receipt.json").read_text())["sha256"])')
          printf 'DIAG_CLOSURE_START utc=%s bash_pid=%s source_sha256=%s\n' "$(date -u +%FT%TZ)" "$$" "$source_sha"
          /usr/bin/time -v -o "$RUNNER_TEMP/us-boundary/publish/resources/closure-time.txt" timeout --signal=TERM --kill-after=30s 35m \
            python scripts/geo/north-america-source/extract-boundary-closure.py \
            --source "$RUNNER_TEMP/us-boundary/country.osm.pbf" --country-iso US \
            --expected-sha256 "$source_sha" --expected-bytes 12196456372 \
            --expected-root-relation-id 148838 --highest-point-node-id 2748929230 \
            --dataset-date 2026-10-09 --out "$RUNNER_TEMP/us-boundary/publish/closure" \
            > "$RUNNER_TEMP/us-boundary/publish/resources/closure.log" 2>&1 &
          stage_pid=$!
          python scripts/geo/north-america-source/boundary-run-monitor.py \
            --root "$RUNNER_TEMP/us-boundary" --pid "$stage_pid" --interval 5 \
            --output "$RUNNER_TEMP/us-boundary/publish/resources/closure-samples.jsonl" --mirror-stdout &
          monitor_pid=$!
          if wait "$stage_pid"; then diagnostic_rc=0; else diagnostic_rc=$?; fi
          wait "$monitor_pid" || true
          exit "$diagnostic_rc"
      - name: Assemble the closure and rebind its receipt within 15 minutes
        id: boundary
        if: steps.closure.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          monitor_pid=''
          stage_pid=''
          stage=boundary
          printf '%s\n' "$(date -u +%FT%TZ)" > "$RUNNER_TEMP/us-boundary/publish/resources/boundary-start.txt"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'us-boundary/publish/result.json'
          result = json.loads(path.read_text())
          result.update(status='HOLD', stage='boundary', reason='Closure polygon assembly and source receipt rebinding have not completed')
          path.write_text(json.dumps(result, indent=2) + '\n')
          PY
          record_exit() {
            code=$?
            printf '%s\n' "$code" > "$RUNNER_TEMP/us-boundary/publish/resources/${stage}-exit.txt"
          }
          trap record_exit EXIT
          capture_signal() {
            signal_name="$1"
            printf '%s\n' "$signal_name" > "$RUNNER_TEMP/us-boundary/publish/resources/${stage}-signal.txt"
            printf 'utc=%s bash_pid=%s stage_pid=%s monitor_pid=%s\n' "$(date -u +%FT%TZ)" "$$" "${stage_pid:-}" "${monitor_pid:-}" \
              > "$RUNNER_TEMP/us-boundary/publish/resources/${stage}-signal-context.txt"
            printf 'DIAG_SIGNAL stage=%s signal=%s utc=%s bash_pid=%s stage_pid=%s monitor_pid=%s\n' "$stage" "$signal_name" "$(date -u +%FT%TZ)" "$$" "${stage_pid:-}" "${monitor_pid:-}"
            if [[ -n "$monitor_pid" ]]; then kill -TERM "$monitor_pid" 2>/dev/null || true; fi
            if [[ -n "$stage_pid" ]]; then kill -TERM "$stage_pid" 2>/dev/null || true; fi
            exit 143
          }
          trap 'capture_signal SIGTERM' TERM
          trap 'capture_signal SIGINT' INT
          subset_sha=$(python -c 'import json,os; from pathlib import Path; p=Path(os.environ["RUNNER_TEMP"])/"us-boundary/publish/closure/receipt.json"; print(json.loads(p.read_text())["outputs"]["boundary-closure.pbf"]["sha256"])')
          subset_bytes=$(python -c 'import json,os; from pathlib import Path; p=Path(os.environ["RUNNER_TEMP"])/"us-boundary/publish/closure/receipt.json"; print(json.loads(p.read_text())["outputs"]["boundary-closure.pbf"]["bytes"])')
          printf 'DIAG_BOUNDARY_START utc=%s bash_pid=%s closure_sha256=%s\n' "$(date -u +%FT%TZ)" "$$" "$subset_sha"
          /usr/bin/time -v -o "$RUNNER_TEMP/us-boundary/publish/resources/boundary-time.txt" timeout --signal=TERM --kill-after=30s 15m \
            python boundary-tooling/scripts/geo/factory/bootstrap/country-boundary.py \
            --pbf "$RUNNER_TEMP/us-boundary/publish/closure/boundary-closure.pbf" --country US \
            --expected-sha256 "$subset_sha" --expected-bytes "$subset_bytes" \
            --dataset-url https://download.geofabrik.de/north-america/us-261009.osm.pbf \
            --dataset-date 2026-10-09 --out "$RUNNER_TEMP/us-boundary/publish/subset-boundary" \
            > "$RUNNER_TEMP/us-boundary/publish/resources/boundary.log" 2>&1 &
          stage_pid=$!
          python scripts/geo/north-america-source/boundary-run-monitor.py \
            --root "$RUNNER_TEMP/us-boundary" --pid "$stage_pid" --interval 5 \
            --output "$RUNNER_TEMP/us-boundary/publish/resources/boundary-samples.jsonl" --mirror-stdout &
          monitor_pid=$!
          if wait "$stage_pid"; then diagnostic_rc=0; else diagnostic_rc=$?; fi
          wait "$monitor_pid" || true
          if [[ "$diagnostic_rc" -ne 0 ]]; then exit "$diagnostic_rc"; fi
          python scripts/geo/north-america-source/rebind-boundary-closure-receipt.py \
            "$RUNNER_TEMP/us-boundary/publish/source-receipt.json" \
            "$RUNNER_TEMP/us-boundary/publish/closure/receipt.json" \
            "$RUNNER_TEMP/us-boundary/publish/subset-boundary/receipt.json" \
            --subset-pbf "$RUNNER_TEMP/us-boundary/publish/closure/boundary-closure.pbf" \
            --out "$RUNNER_TEMP/us-boundary/publish/boundary/receipt.json" \
            > "$RUNNER_TEMP/us-boundary/publish/resources/receipt-rebind.log" 2>&1
          cp "$RUNNER_TEMP/us-boundary/publish/subset-boundary/boundary.geojson" "$RUNNER_TEMP/us-boundary/publish/boundary/boundary.geojson"
      - name: Preserve measured result and precise HOLD on failure
        if: always()
        run: |
          df -B1 "$RUNNER_TEMP" > "$RUNNER_TEMP/us-boundary/publish/resources/disk-after.txt"
          free -b > "$RUNNER_TEMP/us-boundary/publish/resources/memory-after.txt"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          publish = Path(os.environ['RUNNER_TEMP']) / 'us-boundary/publish'
          result_path = publish / 'result.json'
          result = json.loads(result_path.read_text())
          try:
              budgets = {'download': '30-minute download budget', 'closure': '35-minute closure budget', 'boundary': '15-minute boundary budget'}
              for stage in ('download', 'closure', 'boundary'):
                  exit_path = publish / 'resources' / (stage + '-exit.txt')
                  start_path = publish / 'resources' / (stage + '-start.txt')
                  time_path = publish / 'resources' / (stage + '-time.txt')
                  if not exit_path.exists():
                      if stage == 'download' and result['status'] == 'HOLD':
                          raise ValueError(result['reason'])
                      result['stage'] = stage
                      if time_path.exists() and 'Exit status: 124' in time_path.read_text():
                          raise ValueError(budgets[stage] + ' exceeded; exit sentinel was not written')
                      if start_path.exists():
                          raise ValueError(stage + ' started but did not write an exit sentinel; inspect resources/' + stage + '-time.txt and ' + stage + '-signal.txt')
                      raise ValueError(stage + ' stage did not start')
                  code = int(exit_path.read_text())
                  if code:
                      detail = budgets[stage] + ' exceeded' if code == 124 else f'{stage} exited {code}; inspect resources/{stage}.log'
                      if stage == 'boundary' and code != 124:
                          helper_result = publish / 'subset-boundary/result.json'
                          rebind_log = publish / 'resources/receipt-rebind.log'
                          if helper_result.exists():
                              helper_status = json.loads(helper_result.read_text())
                              if helper_status.get('status') == 'HOLD':
                                  detail += ': ' + helper_status.get('reason', 'boundary HOLD')
                              elif rebind_log.exists():
                                  detail += '; inspect resources/receipt-rebind.log'
                      elif stage == 'download' and result['status'] == 'HOLD':
                          detail += ': ' + result['reason']
                      result['stage'] = stage
                      raise ValueError(detail)
              receipt = json.loads((publish / 'boundary/receipt.json').read_text())
              source = json.loads((publish / 'source-receipt.json').read_text())
              closure_path = publish / 'closure/receipt.json'
              closure = json.loads(closure_path.read_text())
              closure_source = closure['source']
              subset = closure['outputs']['boundary-closure.pbf']
              processing = receipt.get('processingInput', {})
              geometry = publish / 'boundary/boundary.geojson'
              geometry_proof = receipt['geometry']
              if source['status'] != 'SOURCE_VERIFIED' or receipt['status'] != 'OSM_COUNTRY_BOUNDARY_CANDIDATE' or receipt['countryISO'] != 'US' or receipt['source']['sha256'] != source['sha256'] or receipt['source']['bytes'] != source['actualBytes']:
                  raise ValueError('boundary candidate country/status/full-source SHA-256/byte linkage mismatch')
              if closure['status'] != 'BOUNDARY_CLOSURE_EXTRACTED' or closure['countryISO'] != 'US' or closure['relation']['id'] != 148838 or closure['relation']['highestPointNodeId'] != 2748929230:
                  raise ValueError('closure receipt country/relation/highest-point proof mismatch')
              if closure_source.get('sha256') != source['sha256'] or closure_source.get('bytes') != source['actualBytes'] or closure_source.get('headerDate') != source['snapshotDate']:
                  raise ValueError('closure receipt is not linked to the verified full source')
              if processing.get('kind') != 'exact-member-way-closure' or processing.get('sha256') != subset['sha256'] or processing.get('bytes') != subset['bytes'] or processing.get('closureReceiptSha256') != hashlib.sha256(closure_path.read_bytes()).hexdigest():
                  raise ValueError('rebound receipt closure processing-input linkage mismatch')
              if processing.get('sourceReceiptSha256') != hashlib.sha256((publish / 'source-receipt.json').read_bytes()).hexdigest():
                  raise ValueError('rebound receipt full-source proof linkage mismatch')
              helper_receipt = publish / 'boundary/subset-receipt.json'
              if not helper_receipt.is_file() or receipt.get('subsetReceipt', {}).get('path') != helper_receipt.name or receipt['subsetReceipt'].get('sha256') != hashlib.sha256(helper_receipt.read_bytes()).hexdigest():
                  raise ValueError('rebound receipt does not preserve the exact helper-generated subset receipt')
