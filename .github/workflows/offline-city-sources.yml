name: Offline city source extraction

on:
  push:
    branches: ['codex/astra-factory-qa-20261011']
    paths:
      - '.github/workflows/offline-city-sources.yml'
      - 'scripts/geo/offline-extract.py'
      - 'scripts/geo/offline-source-batch.json'
      - 'scripts/geo/offline-source-batch.schema.json'

permissions:
  contents: read

concurrency:
  group: offline-city-sources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: read
        env:
          MANIFEST: scripts/geo/offline-source-batch.json
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          value = json.loads(Path(os.environ['MANIFEST']).read_text())
          if value.get('schemaVersion') != 1 or not isinstance(value.get('countries'), list):
              raise SystemExit('offline source manifest must be schema version 1 with countries[]')
          jobs = []
          for country in value['countries']:
              ident = country.get('id')
              source = country.get('file', {})
              cities = country.get('cities')
              if not isinstance(ident, str) or not re.fullmatch(r'[a-z0-9-]+', ident): raise SystemExit('invalid country id')
              if not re.fullmatch(r'https://download\.geofabrik\.de/.+\.osm\.pbf', str(source.get('url', ''))): raise SystemExit(f'{ident}: invalid Geofabrik URL')
              if not isinstance(source.get('bytes'), int) or source['bytes'] <= 0: raise SystemExit(f'{ident}: invalid byte count')
              if not re.fullmatch(r'[0-9a-fA-F]{32}', str(source.get('md5', ''))): raise SystemExit(f'{ident}: invalid MD5')
              if source.get('sha256') and not re.fullmatch(r'[0-9a-fA-F]{64}', str(source['sha256'])): raise SystemExit(f'{ident}: invalid SHA-256')
              if not isinstance(cities, list) or not cities: raise SystemExit(f'{ident}: cities must be non-empty')
              jobs.append({'id': ident, 'url': source['url'], 'bytes': source['bytes'], 'md5': source['md5'].lower(), 'expectedSha256': source.get('sha256', '').lower(), 'cities': cities})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(jobs, separators=(',', ':')) + '\n')
          PY

  extract:
    needs: manifest
    if: ${{ needs.manifest.outputs.matrix != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.manifest.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned pyosmium
        run: python -m pip install --disable-pip-version-check --no-input 'osmium==4.3.1'
      - name: Download and verify country PBF
        env:
          SOURCE_URL: ${{ matrix.url }}
          SOURCE_BYTES: ${{ matrix.bytes }}
          SOURCE_MD5: ${{ matrix.md5 }}
          EXPECTED_SHA256: ${{ matrix.expectedSha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/offline-source/pbf" "$RUNNER_TEMP/offline-source/jobs"
          curl --fail --location --retry 3 --retry-all-errors --output "$RUNNER_TEMP/offline-source/pbf/country.osm.pbf" "$SOURCE_URL"
          test "$(wc -c < "$RUNNER_TEMP/offline-source/pbf/country.osm.pbf")" = "$SOURCE_BYTES"
          printf '%s  %s\n' "$SOURCE_MD5" "$RUNNER_TEMP/offline-source/pbf/country.osm.pbf" | md5sum --check --status
          sha256sum "$RUNNER_TEMP/offline-source/pbf/country.osm.pbf" | cut -d ' ' -f 1 > "$RUNNER_TEMP/offline-source/pbf/sha256.txt"
          if [ -n "$EXPECTED_SHA256" ]; then test "$(cat "$RUNNER_TEMP/offline-source/pbf/sha256.txt")" = "$EXPECTED_SHA256"; fi
      - name: Extract bounded city layers
        env:
          COUNTRY_JSON: ${{ toJSON(matrix) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          country = json.loads(os.environ['COUNTRY_JSON'])
          root = Path(os.environ['RUNNER_TEMP']) / 'offline-source'
          output = root / 'extract'
          jobs = root / 'jobs'
          actual_sha = (root / 'pbf' / 'sha256.txt').read_text().strip()
          for city in country['cities']:
              metadata = jobs / f"{city['id']}.json"
              metadata.write_text(json.dumps({'city': {'id': city['id'], 'name': city['name']}, 'boxes': city['boxes'], 'waterRecipe': city['waterRecipe']}, separators=(',', ':')))
              subprocess.run([
                  'python', 'scripts/geo/offline-extract.py', str(root / 'pbf' / 'country.osm.pbf'), str(metadata),
                  '--dataset-url', country['url'], '--dataset-bytes', str(country['bytes']), '--dataset-md5', country['md5'], '--dataset-sha256', actual_sha, '--output-root', str(output),
              ], check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: offline-city-layers-${{ matrix.id }}-${{ github.sha }}
          path: ${{ runner.temp }}/offline-source/extract/
          if-no-files-found: error
