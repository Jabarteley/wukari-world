name: p7-chunks
on:
  push:
    branches: [claude/alive-p7-light]
    paths: [".github/workflows/p7-chunks.yml"]
jobs:
  chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/alive-p7-base, path: base }
      - uses: actions/checkout@v4
        with: { ref: claude/alive-p7-light, path: mine }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: mine/package-lock.json }
      - run: cd base && npm ci --no-audit --no-fund && npm run build
      - run: cd mine && npm ci --no-audit --no-fund && npm run build
      - name: startup closure
        run: |
          cat > closure.ts <<'JS'
          import { readDist, startupFiles } from './mine/scripts/download-budget.ts'
          const stem = (f: string) => f.replace(/-[\w-]{8}\.js$/, '')
          const load = (dir: string) => { const dist = readDist(`${dir}/dist`); const files = startupFiles(dist, 'lagos')!; return new Map([...files].filter((f) => f.endsWith('.js')).map((f) => [stem(f), dist.get(f)!.length] as const)) }
          const b = load('base'), m = load('mine')
          let sb = 0, sm = 0; const rows: (string | number)[][] = []
          for (const k of new Set([...b.keys(), ...m.keys()])) { const x = b.get(k) ?? 0, y = m.get(k) ?? 0; sb += x; sm += y; rows.push([k, x, y, y - x]) }
          rows.sort((p, q) => (q[2] as number) - (p[2] as number))
          console.log('total base', sb, 'mine', sm)
          for (const r of rows) console.log(r.join('\t'))
          JS
          node --experimental-strip-types closure.ts
