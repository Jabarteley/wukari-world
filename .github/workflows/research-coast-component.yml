name: Research station complete coastline
on:
  push:
    branches: ['codex/world-antarctica-20261011']
    paths: ['scripts/geo/factory/research-coast-component.py', '.github/workflows/research-coast-component.yml']
permissions:
  contents: read
  actions: read
jobs:
  coast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python -m pip install osmium==4.3.1
      - name: Reuse pinned source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38180470971 -n antarctica-pbf-261008 -D source
          gh run download 38180470971 -n research-layers-cba05c329cf9729bfe9988cdf43cb744c66b2ee9 -D layers
      - name: Recover complete connected shoreline
        run: |
          mkdir evidence
          python scripts/geo/factory/research-coast-component.py source/antarctica-261008.osm.pbf layers/extract/rothera/water.json evidence/rothera-complete-coast.json -68.1248 -67.568889
          python scripts/geo/factory/research-coastline.py evidence/rothera-complete-coast.json evidence/rothera-coast-closure.json --lon -68.1248 --lat -67.568889
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rothera-complete-coast-${{ github.sha }}
          path: evidence/
          retention-days: 14
