name: Station coastal terrain candidate
on:
  push:
    branches: ['codex/world-antarctica-20261011']
    paths: ['scripts/geo/factory/research-terrain.py', '.github/workflows/research-terrain.yml']
permissions:
  contents: read
  actions: read
jobs:
  terrain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install shapely==2.1.2 matplotlib==3.10.7
      - name: Retrieve exact source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38180951478 -n rothera-complete-coast-13d4ae60fce3613e908e4405e1e427aed6cf0252 -D coast
          gh run download 38180033319 -n antarctic-source-924610424d357c0076be9261a3edee1720b11e53 -D geometry
      - name: Derive station terrain
        run: python scripts/geo/factory/research-terrain.py coast/rothera-complete-coast.json coast/rothera-coast-closure.json geometry/station-geometry.json scripts/geo/factory/research-source-targets.json evidence
      - name: Check terrain with actual renderer polygon validator
        run: |
          node --experimental-strip-types --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          import {polygonProblem,triangulationProblem} from './src/game/cities/africa/polygonCheck.ts';
          import {toLocal,originAt} from './src/geo/frame.ts';
          const t=JSON.parse(readFileSync('evidence/terrain-candidate.json','utf8'));
          const origin=originAt(-68.1248,-67.568889);
          const results=t.land.map(p=>({polygonProblem:polygonProblem(p),triangulationProblem:triangulationProblem(p,q=>toLocal(origin,...q))}));
          assert.ok(results.every(r=>!r.polygonProblem&&!r.triangulationProblem));
          writeFileSync('evidence/renderer-geometry-check.json',JSON.stringify({sourceGitSHA:process.env.GITHUB_SHA,results,limitation:'Polygon/triangulation only; existing global projection still distorts polar physical scale.'},null,2));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: station-terrain-${{ github.sha }}
          path: evidence/
          retention-days: 14
