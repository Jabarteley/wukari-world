name: Station coastal terrain candidate
on:
  push:
    branches: ['codex/world-antarctica-20261011']
    paths: ['scripts/geo/factory/research-terrain.py', 'src/game/cities/stations/frame.ts', '.github/workflows/research-terrain.yml']
permissions:
  contents: read
  actions: read
jobs:
  terrain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install shapely==2.1.2 matplotlib==3.10.7
      - run: npm run typecheck
      - name: Retrieve exact source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38180951478 -n rothera-complete-coast-13d4ae60fce3613e908e4405e1e427aed6cf0252 -D coast
          gh run download 38180033319 -n antarctic-source-924610424d357c0076be9261a3edee1720b11e53 -D geometry
      - name: Derive station terrain
        run: python scripts/geo/factory/research-terrain.py coast/rothera-complete-coast.json coast/rothera-coast-closure.json geometry/station-geometry.json scripts/geo/factory/research-source-targets.json evidence
      - name: Check terrain with actual renderer polygon validator
        run: |
          node --experimental-strip-types --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          import {polygonProblem,triangulationProblem} from './src/game/cities/africa/polygonCheck.ts';
          import {createStationFrame} from './src/game/cities/stations/frame.ts';
          const t=JSON.parse(readFileSync('evidence/terrain-candidate.json','utf8'));
          const frame=createStationFrame({lon:-68.1248,lat:-67.568889});
          const projected=p=>frame.project({lon:p[0],lat:p[1]});
          const results=t.land.map(p=>({polygonProblem:polygonProblem(p),triangulationProblem:triangulationProblem(p,projected)}));
          assert.ok(results.every(r=>!r.polygonProblem&&!r.triangulationProblem));
          const land=t.land.map(p=>p.map(r=>r.map(projected)));
          let maxRoundTripDegrees=0;
          for(const polygon of t.land) for(const ring of polygon) for(const point of ring){
            const back=frame.unproject(projected(point));
            maxRoundTripDegrees=Math.max(maxRoundTripDegrees,Math.abs(back.lon-point[0]),Math.abs(back.lat-point[1]));
          }
          assert.ok(maxRoundTripDegrees<1e-8);
          const pole=createStationFrame({lon:0,lat:-90});
          for(const lon of [-180,-90,0,90,180]) assert.ok(Math.hypot(...pole.project({lon,lat:-90}))<1e-8);
          assert.throws(()=>frame.project({lon:0,lat:0}));
          assert.throws(()=>frame.unproject([1000,1000]));
          writeFileSync('evidence/station-local-terrain.json',JSON.stringify({sourceGitSHA:process.env.GITHUB_SHA,sourceSha256:t.sourceSha256,projection:'station-local-spherical-orthographic-v1',origin:{lon:-68.1248,lat:-67.568889},unitsPerKm:frame.unitsPerKm,land,registrationAllowed:false}));
          writeFileSync('evidence/renderer-geometry-check.json',JSON.stringify({sourceGitSHA:process.env.GITHUB_SHA,results,maxRoundTripDegrees,poleEquivalence:5,domainRejections:2,limitation:'Station-frame terrain proof only; shared runtime projection integration, station scene and browser acceptance pending.'},null,2));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: station-terrain-${{ github.sha }}
          path: evidence/
          retention-days: 14
