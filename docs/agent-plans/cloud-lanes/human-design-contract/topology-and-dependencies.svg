<path class="rig" d="M670 398L690 413L713 404"/>
<text x="534" y="509" class="small">Jaw/eye articulation requires new</text>
<text x="534" y="530" class="small">morphs or an explicitly versioned rig.</text>
<text x="534" y="562" class="small">Current 23-bone body has neither</text>
<text x="534" y="583" class="small">independent jaw nor eye bones.</text>
<text x="77" y="680" class="sub">Loops illustrate flow only; they are not exported topology, vertex IDs or measured anatomy.</text>
