<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc">
<title id="title">Original human control topology and deformation dependency proposal</title>
<desc id="desc">Conceptual front-face loop diagram, side profile and whole-body joint dependencies. Independent left and right ears, nose, eyes and mouth are marked. This is an original planning diagram, not a character mesh or realism evidence.</desc>
<defs>
  <style>text{font-family:DejaVu Sans,sans-serif;fill:#dae4ef;font-size:17px}.title{font-size:32px;font-weight:bold}.sub{fill:#9eb2c7;font-size:16px}.label{font-size:20px;font-weight:bold}.line{fill:none;stroke:#849fb7;stroke-width:2}.loop{fill:none;stroke:#61d8bf;stroke-width:2}.face{fill:#203445;stroke:#8ea5bb;stroke-width:3}.morph{fill:none;stroke:#edb56f;stroke-width:3}.rig{fill:none;stroke:#829aff;stroke-width:4}.node{fill:#becbff}.small{font-size:14px}</style>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#829aff"/></marker>
</defs>
