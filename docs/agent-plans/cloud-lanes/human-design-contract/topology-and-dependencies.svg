<text x="927" y="659" class="small">Rest/bind correction → garment refit → clip / IK</text>
<text x="927" y="684" class="small">Joint/contact marks are schematic, not 23-bone coordinates.</text>
<text x="49" y="764" class="label">C. Evaluate from immutable inputs; never accumulate deformations</text>
<g fill="#203649" stroke="#466079"><rect x="48" y="790" width="236" height="90" rx="12"/><rect x="325" y="790" width="235" height="90" rx="12"/><rect x="601" y="790" width="235" height="90" rx="12"/><rect x="877" y="790" width="235" height="90" rx="12"/></g>
<text x="68" y="826">Legacy + identity</text><text x="68" y="853" class="small">base + approved endpoint deltas</text>
<text x="344" y="826">Rig / garment fit</text><text x="344" y="853" class="small">rest/bind + seams + anchors</text>
<text x="620" y="826">Expression + clip</text><text x="620" y="853" class="small">correctives + raw pose restore</text>
<text x="896" y="826">Skin / contact</text><text x="896" y="853" class="small">host IK + scene placement</text>
<g class="rig" marker-end="url(#arrow)"><path d="M287 835H317"/><path d="M563 835H593"/><path d="M839 835H869"/></g>
<text x="1141" y="817" class="small">Receiver owns</text><text x="1141" y="842" class="small">actual ordering</text><text x="1141" y="867" class="small">and validation.</text>
<rect x="48" y="913" width="1305" height="113" rx="12" fill="#293344"/>
<text x="67" y="944">Binding identity = body hash + ordered topology hash + skeleton version + anchor revision</text>
<text x="67" y="975" class="sub">LOD/topology changes invalidate triangle/barycentric bindings until a tested correspondence is supplied.</text>
<text x="67" y="1005" class="sub">PROTOTYPE DIAGRAM ONLY • Not a replacement character • No geometry / deformation / in-game realism pass</text>
</svg>
