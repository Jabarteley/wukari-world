<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.AgXToneMapping;renderer.toneMappingExposure=1;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color('#9ba3aa');
scene.add(new THREE.HemisphereLight(0xdce8ff,0x8e7e65,2));
const sun=new THREE.DirectionalLight(0xfff1d8,3);sun.position.set(-8,18,6);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-18,right:18,top:18,bottom:-18,near:1,far:70});sun.shadow.bias=-.001;sun.shadow.normalBias=.025;scene.add(sun);
const camera=new THREE.PerspectiveCamera(49,1,.05,500);
const loader=new GLTFLoader();const receipts=[];const models=[];
try{
 for(const lod of ['near','far']){
  const model=(await loader.loadAsync(`./artifacts/street-${lod}.glb`)).scene;models.push(model);model.visible=false;scene.add(model);
  let meshes=0,triangles=0;const mats=new Set(),textures=new Set();
  model.traverse(o=>{if(o.isMesh){meshes++;triangles+=o.geometry.index.count/3;o.castShadow=true;o.receiveShadow=true;for(const m of (Array.isArray(o.material)?o.material:[o.material])){mats.add(m);if(m.map)textures.add(m.map);if(m.normalMap)textures.add(m.normalMap);}}});
  receipts.push({lod,meshes,triangles,materials:mats.size,textures:textures.size,rawPbrMaterialTypes:[...new Set([...mats].map(m=>m.type))],normalMaps:[...mats].filter(m=>m.normalMap).length,bounds:new THREE.Box3().setFromObject(model)});
 }
 function capture(id,lod,w,h,at,target){models.forEach((m,i)=>m.visible=i===lod);renderer.setSize(w,h);camera.aspect=w/h;camera.position.set(...at);camera.lookAt(...target);camera.updateProjectionMatrix();renderer.render(scene,camera);document.getElementById(id).src=renderer.domElement.toDataURL('image/jpeg',.91);}
 capture('eye',0,960,700,[5.8,1.86,10],[2,.1,0]);
 capture('near',0,600,360,[23,22,30],[0,0,0]);
 capture('far',1,600,360,[23,22,30],[0,0,0]);
 await Promise.all([...document.images].map(i=>i.decode()));
 const gl=renderer.getContext();const debug=gl.getExtension('WEBGL_debug_renderer_info');
 window.receipt={ready:true,three:THREE.REVISION,models:receipts,renderer:debug?gl.getParameter(debug.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER),materialFactorsPreserved:true,routeAuthorized:false};
 window.cleanup=()=>{scene.traverse(o=>{o.geometry?.dispose();for(const m of (Array.isArray(o.material)?o.material:o.material?[o.material]:[])){m.map?.dispose();m.normalMap?.dispose();m.dispose();}});renderer.dispose();renderer.forceContextLoss();window.receipt.disposed=true;};
}catch(e){window.proofError=String(e);throw e;}
