<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Allworld character creator (proof)</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#10201b;font:14px system-ui,sans-serif;color:#eef3ee}
#c{position:fixed;left:0;top:0;width:calc(100% - 360px);height:100%;display:block;touch-action:none;cursor:grab}
body.shoot #c{width:100%}
body.shoot #msg{display:none}
#panel{position:fixed;right:0;top:0;width:360px;height:100%;overflow-y:auto;background:#17302a;padding:10px 12px 40px;box-shadow:-4px 0 16px #0006}
body.shoot #panel{display:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:-10px;background:#17302a;padding:8px 0;z-index:2}
h1{font-size:17px;margin:0}
.group{background:#1d3b33;border-radius:10px;padding:8px 10px 10px;margin:10px 0}
h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:#9fd1bd;margin:0 0 4px}
.field{margin:8px 0}
.lab{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:#b9d6c9;margin-bottom:4px}
.lab b{color:#fff;font-weight:650}
.row{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;color:#eef3ee;background:#25473d;border:1px solid #3c6a5b;border-radius:8px;padding:6px 10px;cursor:pointer;min-height:32px}
button.on{background:#3f8a6f;border-color:#7fe0b6;font-weight:700}
button.primary{background:#d6a23c;border-color:#f0c568;color:#1b1b12;font-weight:750;padding:7px 16px}
button:hover{filter:brightness(1.12)}
.sw{width:30px;height:30px;min-height:30px;padding:0;border-radius:50%;border:2px solid #0006}
.sw.on{outline:3px solid #fff;outline-offset:1px}
input[type=range]{width:100%;margin:0}
.rec{white-space:pre-wrap;word-break:break-all;font:11px ui-monospace,monospace;color:#a9c7ba;margin:0}
#msg{position:fixed;left:0;top:0;width:calc(100% - 360px);height:100%;display:flex;align-items:center;justify-content:center;font-size:18px;color:#cfe0d6;pointer-events:none;z-index:3;text-align:center;padding:20px}
#msg.err{color:#ffb4a8;background:#10201bee}
#msg.hide{display:none}
@media (max-width:760px){#msg{width:100%;height:46%}}
#stats{position:fixed;left:12px;bottom:10px;background:#0009;padding:6px 10px;border-radius:8px;font-size:12px}
body.shoot #stats{display:none}
@media (max-width:760px){
  #c{width:100%;height:46%}
  #panel{top:46%;width:100%;height:54%;box-shadow:0 -4px 16px #0006}
  #stats{bottom:auto;top:8px;left:8px;font-size:11px}
  .sw{width:34px;height:34px;min-height:34px}
}
</style></head>
<body><div id="msg">Loading the park and the character parts…</div><canvas id="c"></canvas><div id="panel"></div><div id="stats"></div><script>addEventListener("error",function(e){var m=document.getElementById("msg");if(m){m.className="err";m.textContent="Something went wrong: "+e.message}});addEventListener("unhandledrejection",function(e){var m=document.getElementById("msg");if(m){m.className="err";m.textContent="Something went wrong: "+(e.reason&&e.reason.message||e.reason)}});</script><script type="module" src="/page.js"></script></body></html>
