<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pro character trial</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#72a5bf;font:14px system-ui,sans-serif;color:#fff}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#labels{position:fixed;inset:0;pointer-events:none;display:grid;grid-template-columns:repeat(3,1fr);align-items:start;gap:4px;padding:10px;box-sizing:border-box}
.tag{justify-self:center;max-width:95%;padding:5px 10px;border-radius:14px;background:#14241fdb;box-shadow:0 2px 8px #0005;font-weight:750;text-align:center;white-space:nowrap}
#caption{position:fixed;left:10px;right:10px;bottom:10px;padding:6px 10px;border-radius:10px;background:#14241fdb;text-align:center;font-size:12px;font-weight:650;pointer-events:none}
@media(max-width:420px){#labels{padding:6px;gap:2px}.tag{padding:4px 6px;font-size:10px;white-space:normal}#caption{left:6px;right:6px;bottom:6px;font-size:10px}}
</style></head>
<body><canvas id="c"></canvas><div id="labels"></div><div id="caption"></div><script type="module" src="/page.js"></script></body></html>
