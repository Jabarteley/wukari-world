<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Allworld wardrobe fit preview</title>
<style>body{margin:0;background:#e5e8e6;color:#17212a;font:14px/1.4 system-ui}header{padding:16px}h1{font-size:20px;margin:0 0 4px}p{margin:0 0 10px}#controls{display:flex;gap:10px;flex-wrap:wrap}label{display:grid;gap:3px;font-size:12px}select,button{font:inherit;padding:5px;background:white;border:1px solid #98a4a6;border-radius:4px}canvas{display:block;width:100%;height:65vh;min-height:430px}pre{padding:12px;background:#17212a;color:#d9eee7;margin:0;font:12px/1.4 monospace;white-space:pre-wrap}button{cursor:pointer}#error{color:#9d2331}</style></head>
<body><header><h1>Wardrobe fit preview</h1><p>Actual shipped skeleton and generated garments. Inspect the face aperture, cuffs, hems, footwear and joint deformation.</p><div id="controls"></div><p id="error" role="alert"></p></header><canvas id="view"></canvas><pre id="stats">Loading actual body…</pre>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/examples/jsm/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'three/examples/jsm/libs/meshopt_decoder.module.js';
import {BODY_FILES} from '/src/scene/body/files.ts';
import {BODY_MANIFEST} from '/src/scene/body/manifest.ts';
import {normalizeLook,LOOK_OPTIONS} from '/src/scene/characters.ts';
import {AVATAR_WEARABLE_IDS,LEGACY_AVATAR_WEARABLE_IDS} from '/src/types/avatar.ts';
import {AVATAR_WEARABLE_CATALOGUE} from '/src/game/wardrobe/catalogue.ts';
import {resolveAvatarWearablesForRenderer} from '/src/game/wardrobe/rules.ts';
import {createWardrobeRenderer} from '/src/scene/wardrobe/renderer.ts';
import {createFacialSampler,faceAtlas,FACIAL_FRAGMENT_PARS,facialMapFragment} from '/src/scene/body/facial.ts';
const $=id=>document.getElementById(id),controls=$('controls');
function select(id,label,values,initial){const l=document.createElement('label');l.append(label);const s=document.createElement('select');s.id=id;for(const value of values){const o=document.createElement('option');o.value=value;o.textContent=AVATAR_WEARABLE_CATALOGUE[value]?.label??value;s.append(o)}s.value=initial??values[0];l.append(s);controls.append(l);return s}
select('body','Body',['woman','man']);select('outfit','Original outfit',LOOK_OPTIONS.outfit.woman,'casual');select('hair','Original hair',LOOK_OPTIONS.hair.woman,'braids');
for(const slot of ['full','head','neck','wrist','shoes','face','ears','carry'])select(slot,slot,['none',...[...AVATAR_WEARABLE_IDS,...LEGACY_AVATAR_WEARABLE_IDS].filter(id=>AVATAR_WEARABLE_CATALOGUE[id].slot===slot)]);
select('fabric','Fabric',LOOK_OPTIONS.fabric,'plain');select('expression','Expression',LOOK_OPTIONS.expression,'smile');select('eyes','Eyes',['open','blink','sleeping'],'open');select('preset','Fit preset',['custom','everyday-glasses','traditional-man','covered-woman','work-carry'],'custom');select('pose','Pose',['idle','walk','jog','sit','lie','dance']);select('camera','View',['front','face','face-angle','face-side','face-back','side','back','three-quarter'],'three-quarter');select('presentation','Presentation',['everyday','bathing','sleeping']);
const clear=document.createElement('button');clear.textContent='Clear wardrobe';controls.append(clear);const play=document.createElement('button');play.textContent='Play motion';controls.append(play);
const scene=new THREE.Scene();scene.background=new THREE.Color('#e5e8e6');const camera=new THREE.PerspectiveCamera(32,1,.01,20);const target=new THREE.Vector3(0,.95,0);const renderer=new THREE.WebGLRenderer({canvas:$('view'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;scene.add(new THREE.HemisphereLight('#ffffff','#736b5b',2));const light=new THREE.DirectionalLight('#fff7e9',2.5);light.position.set(-3,5,4);scene.add(light);scene.add(new THREE.GridHelper(6,30,'#7b8c83','#c5cdc7'));
const PRESETS={
  'everyday-glasses':{body:'woman',outfit:'casual',hair:'braids',face:'legacy-glasses',camera:'front'},
  'traditional-man':{body:'man',outfit:'kaftan',hair:'lowcut',head:'legacy-fila',camera:'three-quarter'},
  'covered-woman':{body:'woman',outfit:'owambe',hair:'bun',head:'hijab-drape',camera:'front'},
  'work-carry':{body:'woman',outfit:'office',hair:'cornrows',face:'legacy-glasses',carry:'legacy-backpack',camera:'three-quarter'},
};
const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);await MeshoptDecoder.ready;const pack=await loader.loadAsync(BODY_FILES.clips);let root,base,mixer,actions,active,wardrobe,facial,faceUniforms,running=false,time=0,generation=0;
function view(){const a=$('camera').value;if(a.startsWith('face')&&base){root?.updateMatrixWorld(true);base.skeleton.getBoneByName('Head')?.getWorldPosition(target);target.y+=.09;camera.position.set(target.x+(a==='face-angle'?.51:a==='face-side'?.72:0),target.y,target.z+(a==='face-back'?-.72:a==='face-side'?0:a==='face-angle'?.51:.72))}else{target.set(0,.95,0);camera.position.set(a==='side'?4:a==='three-quarter'?3:0,.98,a==='side'?0:a==='back'?-4:4)}camera.lookAt(target);render()}
function render(){const canvas=renderer.domElement;const w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==w*renderer.getPixelRatio()||canvas.height!==h*renderer.getPixelRatio())renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.render(scene,camera);if(wardrobe)$('stats').textContent=JSON.stringify({body:$('body').value,expression:$('expression').value,eyes:$('eyes').value,pose:$('pose').value,wardrobe:wardrobe.metrics,draws:renderer.info.render.calls,renderedTriangles:renderer.info.render.triangles,sharedSkeleton:wardrobe.object.skeleton===base.skeleton,lastError:wardrobe.lastError},null,2)}
function syncFace(moving=false){if(!facial||!faceUniforms)return;if(moving)facial.sample(time);else facial.settle();faceUniforms.uExpression.value=facial.state.expression;faceUniforms.uExpressionMotion.value=facial.state.expressionMotion;faceUniforms.uBlink.value=$('eyes').value==='blink'?1:$('eyes').value==='open'?facial.state.blink:0;faceUniforms.uSleeping.value=$('eyes').value==='sleeping'?1:0}
function configureFace(key){
  const atlas=faceAtlas(key);facial=createFacialSampler($('expression').value,`preview:${key}`);
  faceUniforms={uExpression:{value:facial.state.expression},uExpressionMotion:{value:facial.state.expressionMotion},uBlink:{value:0},uSleeping:{value:0},uEyeUv:{value:new THREE.Vector3(...atlas.eyes)},uMouthUv:{value:new THREE.Vector2(...atlas.mouth)},uFitHair:{value:new THREE.Color('#29211c')}};
  for(const material of Array.isArray(base.material)?base.material:[base.material]){
    material.onBeforeCompile=shader=>{
      Object.assign(shader.uniforms,faceUniforms);
      shader.vertexShader=shader.vertexShader.replace('#include <common>','#include <common>\nattribute vec4 color;\nvarying float vFitHair;').replace('#include <begin_vertex>','#include <begin_vertex>\nvFitHair=color.a;');
      shader.fragmentShader=shader.fragmentShader.replace('#include <common>',`#include <common>\nvarying float vFitHair;\nuniform vec3 uFitHair;\n${FACIAL_FRAGMENT_PARS}`).replace('#include <map_fragment>',`${facialMapFragment('1.0')}\ndiffuseColor.rgb=mix(diffuseColor.rgb,uFitHair,clamp(vFitHair,0.0,1.0));`);
    };
    material.customProgramCacheKey=()=>`allworld-wardrobe-face-2-${key}`;material.needsUpdate=true;
  }
  syncFace(false);
}
function face(){if(!facial)return;facial.wear($('expression').value,`preview:${$('body').value}`);syncFace(false);render()}
function dress(){if(!wardrobe)return;const selected=['full','head','neck','wrist','shoes','face','ears','carry'].map(slot=>$(slot).value).filter(id=>id!=='none');const read=normalizeLook({body:$('body').value,outfit:$('outfit').value,hair:$('hair').value,expression:$('expression').value,skin:'#845236',hairColor:'#29211c',outfitColor:'#356b95',bottomsColor:'#c3944a',fabric:$('fabric').value},12);const canonical=selected.filter(id=>AVATAR_WEARABLE_IDS.includes(id));const accessories=selected.filter(id=>id.startsWith('legacy-')).map(id=>id.slice(7));const ids=resolveAvatarWearablesForRenderer({wearables:canonical,accessories});const ok=wardrobe.wear({look:read,ids});wardrobe.setPresentation($('presentation').value);$('error').textContent=ok?'':wardrobe.lastError;render()}
function pose(){stopMotion(false);if(!mixer)return;active?.stop();const name=$('pose').value==='lie'?'sleep':$('pose').value;active=actions.get(name);active?.play();time=name==='idle'?0.1:active?.getClip().duration*.3??0;sample();view()}
function sample(){if(!active)return;active.time=time;const name=$('pose').value;mixer.update(0);if(root)root.position.y=name==='lie'?.58:0.045;root?.updateMatrixWorld(true)}
async function load(){stopMotion(false);const token=++generation;const key=$('body').value==='man'?'male':'female';const gltf=await loader.loadAsync(BODY_FILES[key]);if(token!==generation)return;wardrobe?.dispose();if(root){root.removeFromParent();base.geometry.dispose();base.skeleton.dispose();const mats=Array.isArray(base.material)?base.material:[base.material];for(const m of mats){m.map?.dispose();m.dispose()}}root=gltf.scene;scene.add(root);base=null;root.traverse(n=>{if(n.isSkinnedMesh&&!base)base=n});base.frustumCulled=false;for(const m of Array.isArray(base.material)?base.material:[base.material]){m.vertexColors=false;m.needsUpdate=true}configureFace(key);wardrobe=createWardrobeRenderer(base);mixer=new THREE.AnimationMixer(root);actions=new Map(pack.animations.map(c=>[c.name,mixer.clipAction(c)]));$('outfit').replaceChildren(...LOOK_OPTIONS.outfit[$('body').value].map(v=>{const o=document.createElement('option');o.value=o.textContent=v;return o}));$('hair').replaceChildren(...LOOK_OPTIONS.hair[$('body').value].map(v=>{const o=document.createElement('option');o.value=o.textContent=v;return o}));dress();pose();view();window.wardrobeDiagnostic={root,base,wardrobe,mixer,actions,dress,pose,face,render,set:async(values)=>{if(values.body&&values.body!==$('body').value){$('body').value=values.body;await load()}for(const [id,value]of Object.entries(values))$(id).value=value;dress();face();pose();view()},snapshot:()=>({metrics:wardrobe.metrics,draws:renderer.info.render.calls,triangles:renderer.info.render.triangles})}}
$('body').addEventListener('change',load);$('camera').addEventListener('change',view);$('pose').addEventListener('change',pose);$('expression').addEventListener('change',face);$('eyes').addEventListener('change',face);$('preset').addEventListener('change',async()=>{const preset=PRESETS[$('preset').value];if(!preset)return;for(const slot of ['full','head','neck','wrist','shoes','face','ears','carry'])$(slot).value='none';if(preset.body!==$('body').value){$('body').value=preset.body;await load()}for(const [id,value]of Object.entries(preset))$(id).value=value;dress();face();pose();view()});for(const s of controls.querySelectorAll('select'))if(!['body','camera','pose','expression','eyes','preset'].includes(s.id))s.addEventListener('change',dress);clear.addEventListener('click',()=>{wardrobe.wear(null);render()});
const motionQuery=matchMedia('(prefers-reduced-motion: reduce)');let last=0,demoStart=0,raf=0;
function motionLabel(){play.disabled=motionQuery.matches;play.textContent=motionQuery.matches?'Motion disabled by preference':running?'Stop motion':'Play 8s motion'}
function stopMotion(renderStill=true){running=false;if(raf)cancelAnimationFrame(raf);raf=0;syncFace(false);motionLabel();if(renderStill)render()}
function frame(now){raf=0;if(!running||document.hidden||motionQuery.matches){stopMotion();return}if(now-demoStart>=8000){stopMotion();return}const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;if(active)time%=active.getClip().duration;syncFace(true);sample();if($('camera').value.startsWith('face'))view();else render();raf=requestAnimationFrame(frame)}
play.addEventListener('click',()=>{if(running){stopMotion();return}if(motionQuery.matches)return;running=true;last=demoStart=performance.now();motionLabel();raf=requestAnimationFrame(frame)});
function visibility(){if(document.hidden)stopMotion(false)}function motionPreference(){if(motionQuery.matches)stopMotion(false);else motionLabel()}
const resizeObserver=new ResizeObserver(render);let previewActive=false;function resumePreview(){if(previewActive)return;previewActive=true;document.addEventListener('visibilitychange',visibility);motionQuery.addEventListener('change',motionPreference);resizeObserver.observe($('view'));render()}function suspendPreview(){if(!previewActive)return;previewActive=false;stopMotion(false);resizeObserver.disconnect();document.removeEventListener('visibilitychange',visibility);motionQuery.removeEventListener('change',motionPreference)}
addEventListener('pagehide',suspendPreview);addEventListener('pageshow',resumePreview);motionLabel();resumePreview();await load();
</script></body></html>
